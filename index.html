  <style>
/* Monopoly 3D — stylesheet. Mobile-first and responsive. */

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  height: 100%;
  background: #0d1117;
  color: #e6edf3;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overflow: hidden;
}
#app { height: 100%; }

.hidden { display: none !important; }

/* ---------- Screens ---------- */
.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: clamp(12px, 4vw, 40px);
  overflow: auto;
}

/* ---------- Start screen ---------- */
.title-wrap { text-align: center; max-width: 560px; }
.morelikelame-title {
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(2.5rem, 10vw, 5rem);
  margin: 0;
  letter-spacing: 0.08em;
  color: #f5d720;
  text-shadow: 0 4px 0 #b87333, 0 8px 18px rgba(0,0,0,0.6);
}
.morelikelame-title-3d {
  font-family: Georgia, serif;
  font-size: clamp(1.5rem, 6vw, 3rem);
  color: #4fa3e3;
  text-shadow: 0 3px 0 #1c3f94, 0 6px 14px rgba(0,0,0,0.6);
  margin-bottom: 8px;
}
.subtitle { color: #9aa7b5; margin: 8px 0 24px; font-size: clamp(0.85rem, 2.5vw, 1.1rem); }
.footer-note { color: #6e7681; font-size: 0.8rem; margin-top: 28px; max-width: 480px; line-height: 1.5; }

/* ---------- Buttons ---------- */
.btn {
  appearance: none; cursor: pointer;
  font-size: 1rem; font-weight: 600;
  padding: 12px 22px; border-radius: 10px;
  border: 1px solid #30363d;
  background: #161b22; color: #e6edf3;
  transition: transform .08s ease, background .15s ease, border-color .15s ease;
  min-height: 44px;
}
.btn:hover { background: #21262d; border-color: #444c56; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: #2ea043; border-color: #2ea043; color: #fff; }
.btn.primary:hover { background: #3fb950; }
.btn.ghost { background: transparent; }
.btn.big { font-size: 1.15rem; padding: 16px 32px; }
.btn.small { padding: 6px 10px; font-size: 0.85rem; min-height: 32px; border-radius: 6px; }
.button-col { display: flex; flex-direction: column; gap: 12px; align-items: stretch; width: 100%; max-width: 320px; margin: 0 auto; }

/* ---------- Panels ---------- */
.panel-wrap {
  background: #161b22; border: 1px solid #30363d;
  border-radius: 14px; padding: clamp(16px, 4vw, 28px);
  max-width: 560px; width: 100%;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
}
.panel-wrap h2 { margin: 0 0 16px; color: #f5d720; }
.panel-wrap h3 { margin: 18px 0 10px; font-size: 1rem; color: #9aa7b5; }
.panel-wrap label { display: block; margin: 10px 0 4px; color: #9aa7b5; font-size: 0.9rem; }
.panel-wrap input, .panel-wrap select, .code-input, .num-input, .name-input {
  width: 100%; padding: 10px 12px; border-radius: 8px;
  border: 1px solid #30363d; background: #0d1117; color: #e6edf3;
  font-size: 1rem;
}
.row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.row label { margin: 0; }
.muted { color: #6e7681; font-size: 0.85rem; }

/* ---------- Player cards ---------- */
.player-card {
  display: flex; align-items: center; gap: 10px;
  background: #0d1117; border: 1px solid #30363d; border-left: 4px solid #888;
  border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
}
.player-card .name-input { flex: 1; }
.player-card select { width: auto; }
.color-swatch { width: 18px; height: 18px; border-radius: 50%; border: 1px solid #000; flex-shrink: 0; }

/* ---------- Room code ---------- */
.room-code {
  font-family: monospace; font-size: 1.4rem; letter-spacing: 0.3em;
  text-align: center; padding: 14px; background: #0d1117;
  border: 2px dashed #b87333; border-radius: 10px; color: #f5d720;
  margin: 8px 0;
}
.room-code.big { font-size: clamp(1.6rem, 6vw, 2.6rem); padding: 18px; }

/* ---------- morelikelame screen layout ---------- */
#screen-morelikelame {
  display: grid;
  grid-template-columns: 1fr clamp(240px, 22vw, 300px);
  grid-template-rows: auto 1fr auto;
  grid-template-areas:
    "hud      players"
    "board    players"
    "actions  log";
  gap: 8px; padding: 8px;
  align-items: stretch;
}
#hud-top { grid-area: hud; }
#board-container { grid-area: board; background: #0a0e14; border-radius: 12px; overflow: hidden; min-height: 0; }
#action-bar { grid-area: actions; }
#players-panel { grid-area: players; overflow-y: auto; }
#log-panel { grid-area: log; max-height: 140px; overflow-y: auto; }
#btn-menu {
  position: absolute; top: 12px; right: 12px; z-index: 50;
  width: 40px; height: 40px; border-radius: 8px;
  background: #161b22; color: #e6edf3; border: 1px solid #30363d;
  cursor: pointer; font-size: 1.2rem;
}

/* ---------- HUD ---------- */
.turn-indicator {
  background: #161b22; border: 1px solid #30363d; border-top: 3px solid #888;
  border-radius: 10px; padding: 10px 14px; display: flex; align-items: center;
  justify-content: space-between; gap: 12px;
}
.turn-indicator .who { font-size: 1.05rem; }
.turn-indicator .who b { color: #fff; }
.dice-display { font-size: 1.1rem; color: #f5d720; }

/* ---------- Action bar ---------- */
#action-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 8px; }
.action-group { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Players panel ---------- */
#players-panel { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 10px; }
#players-panel h3 { margin: 0 0 8px; color: #9aa7b5; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.08em; }
.pp-card {
  background: #0d1117; border: 1px solid #30363d; border-left: 4px solid #888;
  border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer;
  transition: background .12s;
}
.pp-card:hover { background: #161b22; }
.pp-card.active { box-shadow: 0 0 0 1px #f5d720 inset; }
.pp-card.bankrupt { opacity: 0.45; }
.pp-name { font-size: 0.92rem; display: flex; align-items: center; gap: 6px; }
.pp-name .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.pp-cash { font-size: 1.1rem; font-weight: 700; color: #3fb950; margin-top: 2px; }
.pp-meta { font-size: 0.78rem; color: #9aa7b5; }

/* ---------- Log ---------- */
#log-panel { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 10px; }
#log-panel h3 { margin: 0 0 6px; color: #9aa7b5; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; }
.log-list { display: flex; flex-direction: column; gap: 3px; }
.log-entry { font-size: 0.78rem; color: #9aa7b5; line-height: 1.3; }

/* ---------- Modals ---------- */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65);
  backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center; z-index: 100;
  padding: 16px;
}
.modal-card {
  background: #161b22; border: 1px solid #30363d; border-radius: 14px;
  padding: 24px; max-width: 520px; width: 100%; max-height: 88vh; overflow-y: auto;
  box-shadow: 0 18px 60px rgba(0,0,0,0.6);
}
.modal-card h2 { margin: 0 0 14px; color: #f5d720; }
.modal-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }

/* ---------- Card display ---------- */
.card-display {
  border-radius: 10px; padding: 20px; text-align: center; min-height: 120px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.05rem; line-height: 1.5;
}
.card-display.chance { background: #f5d720; color: #1a1a1a; }
.card-display.chest { background: #2c7be0; color: #fff; }
.card-display p { margin: 0; }

/* ---------- Deed rows ---------- */
.deed-list { display: flex; flex-direction: column; gap: 6px; }
.deed-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: #0d1117; border: 1px solid #30363d; border-left: 4px solid #888;
  border-radius: 8px; padding: 8px 10px; flex-wrap: wrap;
}
.deed-info { flex: 1; min-width: 140px; }
.deed-name { font-weight: 600; font-size: 0.95rem; }
.deed-meta { font-size: 0.8rem; color: #9aa7b5; }
.deed-actions { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- Trade modal ---------- */
.trade-body { display: flex; flex-direction: column; gap: 12px; }
.trade-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.trade-col { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 10px; }
.trade-col h4 { margin: 0 0 8px; color: #f5d720; font-size: 0.95rem; }
.prop-checks { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.prop-check { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; cursor: pointer; }
.prop-check span { border-left: 4px solid #888; padding-left: 6px; }
.auction-body { display: flex; flex-direction: column; gap: 6px; }
.auction-body p { margin: 4px 0; }

/* ---------- Toast ---------- */
#toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #1c2128; color: #e6edf3; border: 1px solid #30363d;
  padding: 10px 18px; border-radius: 24px; font-size: 0.9rem;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 200;
  max-width: 80vw; text-align: center;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- morelikelame over ---------- */
.win-title { font-family: Georgia, serif; color: #f5d720; font-size: clamp(2rem, 8vw, 3.5rem); margin: 0; }
.win-name { font-size: clamp(1.2rem, 5vw, 2rem); font-weight: 700; margin: 12px 0 24px; }

/* ---------- Responsive ---------- */
@media (max-width: 760px) {
  #screen-morelikelame {
    grid-template-columns: 1fr;
    grid-template-rows: auto minmax(280px, 1fr) auto auto;
    grid-template-areas:
      "hud"
      "board"
      "actions"
      "log";
    padding: 6px;
  }
  #players-panel {
    position: fixed; bottom: 0; left: 0; right: 0;
    max-height: 38vh; border-radius: 14px 14px 0 0;
    transform: translateY(calc(100% - 44px));
    transition: transform .2s;
    z-index: 30;
  }
  #players-panel:hover, #players-panel:focus-within { transform: translateY(0); }
  #log-panel { max-height: 90px; }
  .trade-cols { grid-template-columns: 1fr; }
  #btn-menu { top: 8px; right: 8px; }
}

/* Make the board container fill its grid cell properly */
#board-container { width: 100%; height: 100%; }
#board-container canvas { display: block; }

</head>

// ===== js/audio.js =====
// audio.js — procedural sound effects via the Web Audio API.
// No external audio files are loaded; every sound is synthesized at runtime.
// This keeps the project self-contained and free of licensing concerns.

let ctx = null;
let enabled = true;
let master = null;

function ac() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = 0.6;
    master.connect(ctx.destination);
  }
  return ctx;
}

function setEnabled(v) { enabled = v; }
function isEnabled()   { return enabled; }
function setVolume(v)  { if (master) master.gain.value = Math.max(0, Math.min(1, v)); }

function tone(freq, dur, type = 'sine', vol = 0.2, when = 0) {
  if (!enabled) return;
  const c = ac();
  const t0 = c.currentTime + when;
  const osc = c.createOscillator();
  const g = c.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g).connect(master);
  osc.start(t0);
  osc.stop(t0 + dur + 0.03);
}

function sweep(f0, f1, dur, type = 'sine', vol = 0.18, when = 0) {
  if (!enabled) return;
  const c = ac();
  const t0 = c.currentTime + when;
  const osc = c.createOscillator();
  const g = c.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(f0, t0);
  osc.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g).connect(master);
  osc.start(t0);
  osc.stop(t0 + dur + 0.03);
}

function noise(dur, vol = 0.15, when = 0, freq = 900, q = 0.8) {
  if (!enabled) return;
  const c = ac();
  const t0 = c.currentTime + when;
  const buf = c.createBuffer(1, Math.max(1, Math.floor(c.sampleRate * dur)), c.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
  const src = c.createBufferSource();
  src.buffer = buf;
  const filter = c.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = freq;
  filter.Q.value = q;
  const g = c.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(filter).connect(g).connect(master);
  src.start(t0);
  src.stop(t0 + dur + 0.03);
}

// ===== js/save.js =====
// save.js — persist/restore the morelikelame state to localStorage so a session can
// survive a page reload. State is plain JSON (see rules.js), so it serializes
// directly.

const KEY = 'monopoly3d_save_v1';
const META_KEY = 'monopoly3d_meta_v1';

function savemorelikelame(state, meta = {}) {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    localStorage.setItem(META_KEY, JSON.stringify({
      savedAt: Date.now(),
      mode: meta.mode || 'local',
      selfId: meta.selfId || null,
      roomCode: meta.roomCode || null,
      players: meta.players || [],
    }));
    return true;
  } catch (e) {
    console.warn('save failed', e);
    return false;
  }
}

function loadmorelikelame() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    const state = JSON.parse(raw);
    const metaRaw = localStorage.getItem(META_KEY);
    const meta = metaRaw ? JSON.parse(metaRaw) : {};
    return { state, meta };
  } catch (e) {
    return null;
  }
}

function clearSave() {
  try {
    localStorage.removeItem(KEY);
    localStorage.removeItem(META_KEY);
  } catch (e) { /* ignore */ }
}

function hasSave() {
  try { return !!localStorage.getItem(KEY); } catch (e) { return false; }
}


// ===== js/network.js =====
// network.js — PeerJS host/client networking.
// PeerJS uses WebRTC (with the free public PeerJS cloud broker for signaling),
// so no backend server is required and the whole thing works on GitHub Pages.
//
// Modes:
//   host   — authoritative: owns the morelikelame state, applies actions, broadcasts.
//   client — sends action requests to the host, receives state broadcasts.
//
// The host's Peer ID is "mp3d-XXXX" where XXXX is a short room code shared
// with other players.

const PREFIX = 'mp3d-';

// Public STUN servers (Google). These help peers behind common home routers
// discover their public address so a direct WebRTC data channel can form.
// (We don't ship a TURN relay: free public TURN servers are unreliable and
// often shut down. For symmetric-NAT / strict-corporate-firewall networks,
// direct P2P may still fail — local Pass & Play always works as a fallback.)
const ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'stun:stun2.l.google.com:19302' },
  { urls: 'stun:stun3.l.google.com:19302' },
];

const PEER_OPTS = {
  debug: 1,
  config: { iceServers: ICE_SERVERS },
};

function makeRoomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 4; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

function peerIdFor(code) { return PREFIX + String(code || '').toUpperCase().trim(); }

// PeerJS delivers data as whatever was sent. We send objects, but defensively
// accept strings too (in case the far side or a future PeerJS build stringifies).
function parseMsg(raw) {
  if (raw && typeof raw === 'object') return raw;
  if (typeof raw === 'string') {
    try { const m = JSON.parse(raw); if (m && typeof m === 'object') return m; } catch (e) {}
  }
  return null;
}

class Network {
  constructor() {
    this.peer = null;
    this.mode = null;          // 'host' | 'client'
    this.code = null;
    this.selfId = null;
    this.conns = new Map();    // connId -> DataConnection (host side)
    this._outbox = new Map();  // connId -> [] of queued messages waiting for conn 'open'
    this.hostConn = null;      // DataConnection (client side)
    this.onState = null;       // (state) => void  (client receives state)
    this.onJoin = null;        // (connId, joinMsg) => void  (host receives a join)
    this.onAction = null;      // (action, fromConnId) => void  (host receives action)
    this.onPeerOpen = null;    // () => void
    this.onPeerError = null;   // (err) => void
    this.onConnClose = null;   // (connId) => void
  }

  // ---- Host ---------------------------------------------------------------
  host(code) {
    this.mode = 'host';
    this.code = code;
    return new Promise((resolve, reject) => {
      let settled = false;
      const timeout = setTimeout(() => {
        if (settled) return;
        settled = true;
        try { this.peer && this.peer.destroy(); } catch (e) {}
        reject(new Error('Connection timed out — the PeerJS broker may be unreachable. Try again or play locally.'));
      }, 15000);
      try {
        this.peer = new window.Peer(peerIdFor(code), PEER_OPTS);
      } catch (e) {
        clearTimeout(timeout);
        reject(e); return;
      }
      this.peer.on('open', (id) => {
        if (settled) return;
        settled = true;
        clearTimeout(timeout);
        this.selfId = id;
        this.onPeerOpen && this.onPeerOpen();
        resolve(id);
      });
      this.peer.on('error', (err) => {
        this.onPeerError && this.onPeerError(err);
        if (settled) return;
        if (err.type === 'unavailable-id') {
          settled = true;
          clearTimeout(timeout);
          reject(err);
        }
      });
      this.peer.on('connection', (conn) => this._acceptHost(conn));
    });
  }

  _acceptHost(conn) {
    // Register the connection immediately (don't wait for 'open') so that a
    // join message arriving in the same breath can be answered. Outbound
    // messages are queued until the data channel actually opens.
    this.conns.set(conn.peer, conn);
    if (!this._outbox.has(conn.peer)) this._outbox.set(conn.peer, []);

    const flush = () => {
      const q = this._outbox.get(conn.peer);
      if (!q) return;
      while (q.length) {
        const msg = q.shift();
        try { conn.send(msg); } catch (e) { q.unshift(msg); break; }
      }
    };

    conn.on('open', flush);

    conn.on('data', (raw) => {
      const msg = parseMsg(raw);
      if (!msg) return;
      if (msg.type === 'join') {
        this.onJoin && this.onJoin(conn.peer, msg);
      } else if (msg.type === 'action') {
        this.onAction && this.onAction(msg.action, conn.peer);
      } else if (msg.type === 'leave') {
        this.onConnClose && this.onConnClose(conn.peer);
        this._dropConn(conn.peer);
      }
    });

    conn.on('close', () => {
      this.onConnClose && this.onConnClose(conn.peer);
      this._dropConn(conn.peer);
    });

    conn.on('error', () => {
      this._dropConn(conn.peer);
    });
  }

  _dropConn(connId) {
    this.conns.delete(connId);
    this._outbox.delete(connId);
  }

  broadcast(msg) {
    for (const connId of this.conns.keys()) {
      this._send(connId, msg);
    }
  }

  sendTo(connId, msg) {
    this._send(connId, msg);
  }

  // Internal: send an object to one connection, queueing if not yet open.
  _send(connId, msg) {
    const conn = this.conns.get(connId);
    if (!conn) return;
    if (conn.open) {
      try { conn.send(msg); } catch (e) { /* ignore */ }
    } else {
      // Queue until the data channel opens; flush happens on conn 'open'.
      let q = this._outbox.get(connId);
      if (!q) { q = []; this._outbox.set(connId, q); }
      q.push(msg);
    }
  }

  // ---- Client -------------------------------------------------------------
  join(code) {
    this.mode = 'client';
    this.code = code;
    return new Promise((resolve, reject) => {
      let settled = false;
      const timeout = setTimeout(() => {
        if (settled) return;
        settled = true;
        try { this.peer && this.peer.destroy(); } catch (e) {}
        reject(new Error('Connection timed out — could not reach the host or the PeerJS broker. Try again in a moment.'));
      }, 20000);
      try {
        this.peer = new window.Peer(PEER_OPTS);
      } catch (e) { clearTimeout(timeout); reject(e); return; }

      const targetId = peerIdFor(code);
      const MAX_ATTEMPTS = 3;
      let attempt = 0;

      const tryConnect = () => {
        attempt++;
        // The free public PeerJS broker is occasionally out of sync with a
        // freshly-registered host, returning 'peer-unavailable' on the first
        // try. A short backoff + retry resolves the vast majority of cases.
        let conn = null;
        let attemptDone = false;

        const giveUp = (reason) => {
          if (attemptDone) return;
          attemptDone = true;
          if (attempt < MAX_ATTEMPTS) {
            console.warn(`PeerJS: connect attempt ${attempt}/${MAX_ATTEMPTS} failed (${reason}). Retrying…`);
            setTimeout(tryConnect, 1200 * attempt);
          } else {
            if (settled) return;
            settled = true;
            clearTimeout(timeout);
            reject(new Error(`Could not reach the host after ${MAX_ATTEMPTS} attempts. The room code may be wrong, the host may have left, or the PeerJS broker is busy. Try again or play locally.`));
          }
        };

        try {
          conn = this.peer.connect(targetId, { reliable: true });
        } catch (e) {
          giveUp(e.type || e.message || 'connect threw');
          return;
        }
        this.hostConn = conn;

        conn.on('open', () => {
          if (attemptDone) return;
          attemptDone = true;
          if (settled) return;
          settled = true;
          clearTimeout(timeout);
          this.onPeerOpen && this.onPeerOpen();
          resolve(this.selfId);
        });

        conn.on('data', (raw) => {
          const msg = parseMsg(raw);
          if (!msg) return;
          if (msg.type === 'state' || msg.type === 'welcome' || msg.type === 'lobby') {
            this.onState && this.onState(msg);
          }
        });

        conn.on('error', (err) => {
          this.onPeerError && this.onPeerError(err);
          giveUp((err && err.type) || 'conn-error');
        });

        conn.on('close', () => {
          giveUp('closed');
        });
      };

      this.peer.on('open', (id) => {
        if (settled) return;
        this.selfId = id;
        tryConnect();
      });

      this.peer.on('error', (err) => {
        this.onPeerError && this.onPeerError(err);
        // peer-unavailable from the broker: retry from a fresh connection.
        if (err.type === 'peer-unavailable') {
          if (settled) return;
          // Hand off to the retry path (don't reject immediately).
          if (attempt === 0) {
            // 'open' may not have fired yet; defer first attempt.
            return;
          }
          // Otherwise let the conn-level giveUp/retry handle it.
          return;
        }
        if (settled) return;
        settled = true;
        clearTimeout(timeout);
        reject(err);
      });
    });
  }

  // Client -> host messages (sent as objects; PeerJS serializes them).
  sendJoin(profile) {
    if (this.hostConn) {
      this._sendViaHostConn({ type: 'join', ...profile });
    }
  }
  sendAction(action) {
    if (this.hostConn) {
      this._sendViaHostConn({ type: 'action', action });
    }
  }
  sendLeave() {
    if (this.hostConn) {
      try { this._sendViaHostConn({ type: 'leave' }); } catch (e) {}
    }
  }

  _sendViaHostConn(msg) {
    const conn = this.hostConn;
    if (!conn) return;
    if (conn.open) {
      try { conn.send(msg); } catch (e) { /* ignore */ }
    } else {
      // Buffer briefly; the client side resolves join() only after open, so
      // this is mostly a safety net.
      const retry = () => {
        if (conn.open) { try { conn.send(msg); } catch (e) {} }
        else if (conn._destroyed || conn._peerDestroyed) { /* give up */ }
        else { setTimeout(retry, 100); }
      };
      setTimeout(retry, 50);
    }
  }

  close() {
    try { this.conns.forEach(c => c.close()); } catch (e) {}
    try { if (this.hostConn) this.hostConn.close(); } catch (e) {}
    try { if (this.peer) this.peer.destroy(); } catch (e) {}
    this.conns.clear();
    this._outbox.clear();
    this.hostConn = null;
    this.peer = null;
  }
}


// ===== js/textures.js =====
// textures.js — CanvasTexture generators for the 3D board.
// Every texture is drawn at runtime onto a <canvas> and wrapped in a
// THREE.CanvasTexture. No image files are needed.



function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

function wrap(canvas) {
  const t = new THREE.CanvasTexture(canvas);
  t.anisotropy = 8;
  t.needsUpdate = true;
  return t;
}

function fitText(ctx, text, maxW) {
  // Truncate with ellipsis if too wide.
  if (ctx.measureText(text).width <= maxW) return text;
  let s = text;
  while (s.length > 1 && ctx.measureText(s + '…').width > maxW) s = s.slice(0, -1);
  return s + '…';
}

function wrapText(ctx, text, maxW, maxLines) {
  const words = text.split(/\s+/);
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width <= maxW) {
      line = test;
    } else {
      if (line) lines.push(line);
      line = w;
      if (lines.length === maxLines - 1) break;
    }
  }
  if (line) lines.push(line);
  if (lines.length > maxLines) lines.length = maxLines;
  return lines;
}

// Tile top face for a property: a colored bar across the outer edge
// (the "title deed" strip), the name, and the price.
// Orientation: 0 = bottom row (bar on bottom), 1 = left col (bar on left),
// 2 = top row (bar on top), 3 = right col (bar on right).
function tileTexture(space, orientation = 0) {
  const W = 256, H = 256;
  const c = makeCanvas(W, H);
  const x = c.getContext('2d');

  // base board cream
  x.fillStyle = '#f4ecd6';
  x.fillRect(0, 0, W, H);
  // subtle inner border
  x.strokeStyle = '#c8b88a';
  x.lineWidth = 4;
  x.strokeRect(2, 2, W - 4, H - 4);

  // For corners, draw a big icon/symbol instead of a colored bar.
  if (space.type === 'go') {
    x.fillStyle = '#e74c3c';
    x.font = 'bold 70px Georgia, serif';
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.fillText('GO', W / 2, H / 2 - 10);
    x.fillStyle = '#222';
    x.font = 'bold 22px Arial';
    x.fillText('Collect $200', W / 2, H / 2 + 50);
    // arrow
    x.strokeStyle = '#e74c3c';
    x.lineWidth = 8;
    x.beginPath();
    x.arc(W / 2, H / 2 + 90, 24, Math.PI * 0.2, Math.PI * 1.8);
    x.stroke();
    return wrap(c);
  }
  if (space.type === 'jail') {
    x.fillStyle = '#f5b041';
    x.fillRect(0, 0, W, H);
    x.strokeStyle = '#222';
    x.lineWidth = 6;
    x.strokeRect(3, 3, W - 6, H - 6);
    // bars
    x.strokeStyle = '#222';
    x.lineWidth = 8;
    for (let i = 0; i < 5; i++) {
      const px = 70 + i * 30;
      x.beginPath(); x.moveTo(px, 60); x.lineTo(px, 200); x.stroke();
    }
    x.fillStyle = '#222';
    x.font = 'bold 20px Arial';
    x.textAlign = 'center';
    x.fillText('JAIL', W / 2, 40);
    return wrap(c);
  }
  if (space.type === 'parking') {
    x.fillStyle = '#7f8c8d';
    x.fillRect(0, 0, W, H);
    x.strokeStyle = '#fff';
    x.lineWidth = 6;
    x.strokeRect(3, 3, W - 6, H - 6);
    x.fillStyle = '#fff';
    x.font = 'bold 22px Arial';
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.fillText('FREE', W / 2, H / 2 - 20);
    x.fillText('PARKING', W / 2, H / 2 + 14);
    // a simple car glyph
    x.fillStyle = '#ecf0f1';
    x.fillRect(W / 2 - 28, H / 2 + 36, 56, 22);
    x.fillRect(W / 2 - 18, H / 2 + 30, 36, 12);
    return wrap(c);
  }
  if (space.type === 'gotojail') {
    x.fillStyle = '#c0392b';
    x.fillRect(0, 0, W, H);
    x.strokeStyle = '#fff';
    x.lineWidth = 6;
    x.strokeRect(3, 3, W - 6, H - 6);
    x.fillStyle = '#fff';
    x.font = 'bold 20px Arial';
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.fillText('GO TO', W / 2, H / 2 - 28);
    x.fillText('JAIL', W / 2, H / 2 + 0);
    x.font = '14px Arial';
    x.fillText('Do not pass GO', W / 2, H / 2 + 38);
    x.fillText('Do not collect $200', W / 2, H / 2 + 58);
    return wrap(c);
  }

  // Color strip on the outer edge
  const stripColor = space.group ? GROUP_COLORS[space.group] : null;
  const stripW = 70;
  x.save();
  if (stripColor) {
    x.fillStyle = stripColor;
    if (orientation === 0)      x.fillRect(0, H - stripW, W, stripW);   // bar bottom
    else if (orientation === 1) x.fillRect(0, 0, stripW, H);            // bar left
    else if (orientation === 2) x.fillRect(0, 0, W, stripW);            // bar top
    else                        x.fillRect(W - stripW, 0, stripW, H);   // bar right
  }
  x.restore();

  // Symbol for non-property non-corner spaces
  if (space.type === 'chance') {
    x.fillStyle = '#f5d720';
    x.fillRect(0, 0, W, H);
    x.fillStyle = '#222';
    x.font = 'bold 110px Georgia, serif';
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.fillText('?', W / 2, H / 2 + 6);
    x.font = 'bold 18px Arial';
    x.fillText('CHANCE', W / 2, H - 24);
    return wrap(c);
  }
  if (space.type === 'chest') {
    x.fillStyle = '#2c7be0';
    x.fillRect(0, 0, W, H);
    x.fillStyle = '#f5d720';
    x.font = 'bold 64px Georgia, serif';
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.fillText('★', W / 2, H / 2 - 6);
    x.fillStyle = '#fff';
    x.font = 'bold 16px Arial';
    x.fillText('COMMUNITY', W / 2, H - 40);
    x.fillText('CHEST', W / 2, H - 22);
    return wrap(c);
  }
  if (space.type === 'tax') {
    x.fillStyle = '#f4ecd6';
    x.fillRect(0, 0, W, H);
    x.fillStyle = '#222';
    x.font = 'bold 38px Arial';
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.fillText(space.amount >= 200 ? 'INCOME' : 'LUXURY', W / 2, H / 2 - 24);
    x.fillText('TAX', W / 2, H / 2 + 16);
    x.font = 'bold 26px Arial';
    x.fillText('Pay $' + space.amount, W / 2, H / 2 + 60);
    return wrap(c);
  }
  if (space.type === 'rail') {
    x.fillStyle = '#2c2c2c';
    x.fillRect(0, 0, W, H);
    x.strokeStyle = '#f4ecd6';
    x.lineWidth = 3;
    x.strokeRect(3, 3, W - 6, H - 6);
    // simple train glyph
    x.fillStyle = '#f4ecd6';
    x.fillRect(W / 2 - 40, H / 2 - 18, 80, 36);
    x.fillStyle = '#2c2c2c';
    x.fillRect(W / 2 - 30, H / 2 - 10, 18, 18);
    x.fillRect(W / 2 - 6,  H / 2 - 10, 18, 18);
    x.fillStyle = '#f4ecd6';
    x.font = 'bold 14px Arial';
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.fillText('RAILROAD', W / 2, 24);
    x.font = 'bold 16px Arial';
    wrapText(x, space.name, W - 24, 3).forEach((ln, i) =>
      x.fillText(ln, W / 2, H - 60 + i * 16));
    x.font = 'bold 18px Arial';
    x.fillText('$' + space.price, W / 2, H - 18);
    return wrap(c);
  }
  if (space.type === 'utility') {
    x.fillStyle = '#7f8c8d';
    x.fillRect(0, 0, W, H);
    x.strokeStyle = '#fff';
    x.lineWidth = 3;
    x.strokeRect(3, 3, W - 6, H - 6);
    x.fillStyle = '#fff';
    x.font = 'bold 16px Arial';
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.fillText('UTILITY', W / 2, 24);
    // lightbulb / faucet glyph
    if (space.name.includes('Electric')) {
      x.beginPath();
      x.arc(W / 2, H / 2 - 6, 26, 0, Math.PI * 2);
      x.fill();
      x.fillStyle = '#7f8c8d';
      x.fillRect(W / 2 - 10, H / 2 + 14, 20, 16);
    } else {
      x.fillRect(W / 2 - 6, H / 2 - 30, 12, 50);
      x.beginPath();
      x.arc(W / 2, H / 2 + 22, 14, 0, Math.PI);
      x.fill();
    }
    x.fillStyle = '#fff';
    x.font = 'bold 14px Arial';
    wrapText(x, space.name, W - 24, 2).forEach((ln, i) =>
      x.fillText(ln, W / 2, H - 50 + i * 16));
    x.font = 'bold 18px Arial';
    x.fillText('$' + space.price, W / 2, H - 18);
    return wrap(c);
  }

  // Property tile: name + price + colored bar
  x.fillStyle = '#222';
  x.font = 'bold 18px Arial';
  x.textAlign = 'center';
  x.textBaseline = 'middle';
  const nameAreaY = orientation === 2 ? stripW + 10 : 20;
  const lines = wrapText(x, space.name, W - 20, 3);
  lines.forEach((ln, i) => x.fillText(ln, W / 2, nameAreaY + i * 20));
  x.font = 'bold 22px Arial';
  x.fillStyle = '#1f6f3f';
  x.fillText('$' + space.price, W / 2, H - stripW / 2);
  return wrap(c);
}

// ===== js/tokens.js =====
// tokens.js — low-poly 3D player tokens built from Three.js primitives.
// Each factory returns a THREE.Group centered at the origin, roughly 1 unit tall.
// Six tokens: hat, car, ship, dog, boot, wheelbarrow.


function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({
    color, roughness: 0.55, metalness: 0.15, flatShading: true, ...opts,
  });
}

function mesh(geo, material) {
  const m = new THREE.Mesh(geo, material);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

// Top hat: a cylinder + a flattened torus-ish brim (a flat disc).
function makeHat(color) {
  const g = new THREE.Group();
  const body = mesh(new THREE.CylinderGeometry(0.36, 0.40, 0.62, 14), mat(color));
  body.position.y = 0.32;
  g.add(body);
  // top opening (slightly recessed)
  const top = mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.08, 14), mat(0x111111));
  top.position.y = 0.62;
  g.add(top);
  // brim
  const brim = mesh(new THREE.CylinderGeometry(0.72, 0.72, 0.08, 24), mat(color));
  brim.position.y = 0.02;
  g.add(brim);
  // band
  const band = mesh(new THREE.CylinderGeometry(0.41, 0.41, 0.10, 14), mat(0xd23b3b));
  band.position.y = 0.18;
  g.add(band);
  return g;
}

// Racecar: a box body + cabin + 4 wheels.
function makeCar(color) {
  const g = new THREE.Group();
  const body = mesh(new THREE.BoxGeometry(1.05, 0.32, 0.55), mat(color));
  body.position.y = 0.36;
  g.add(body);
  const cabin = mesh(new THREE.BoxGeometry(0.5, 0.28, 0.5), mat(color));
  cabin.position.set(-0.05, 0.62, 0);
  g.add(cabin);
  const windshield = mesh(new THREE.BoxGeometry(0.06, 0.22, 0.42), mat(0x8ed6f5, { roughness: 0.2, metalness: 0.4 }));
  windshield.position.set(0.2, 0.62, 0);
  g.add(windshield);
  const wheelGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.12, 12);
  const wheelMat = mat(0x1a1a1a);
  const wheelPos = [[0.36, 0.18, 0.32], [0.36, 0.18, -0.32], [-0.36, 0.18, 0.32], [-0.36, 0.18, -0.32]];
  for (const [px, py, pz] of wheelPos) {
    const w = mesh(wheelGeo, wheelMat);
    w.rotation.x = Math.PI / 2;
    w.position.set(px, py, pz);
    g.add(w);
  }
  // headlights
  const hl = mesh(new THREE.BoxGeometry(0.06, 0.08, 0.1), mat(0xfff2a0, { emissive: 0x444000 }));
  hl.position.set(0.54, 0.36, 0.18); g.add(hl);
  const hl2 = mesh(new THREE.BoxGeometry(0.06, 0.08, 0.1), mat(0xfff2a0, { emissive: 0x444000 }));
  hl2.position.set(0.54, 0.36, -0.18); g.add(hl2);
  return g;
}

// Battleship: a hull + superstructure + funnels.
function makeShip(color) {
  const g = new THREE.Group();
  const hullGeo = new THREE.CylinderGeometry(0.42, 0.62, 1.2, 8);
  hullGeo.rotateZ(Math.PI / 2);
  const hull = mesh(hullGeo, mat(color));
  hull.position.y = 0.28;
  hull.scale.set(1, 0.55, 0.8);
  g.add(hull);
  const deck = mesh(new THREE.BoxGeometry(1.1, 0.1, 0.55), mat(0x6b4423));
  deck.position.y = 0.5; g.add(deck);
  const bridge = mesh(new THREE.BoxGeometry(0.5, 0.3, 0.45), mat(0xeae0c8));
  bridge.position.set(0.05, 0.7, 0); g.add(bridge);
  const gun = mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.45, 8), mat(0x222222));
  gun.rotation.z = Math.PI / 2;
  gun.position.set(-0.35, 0.78, 0); g.add(gun);
  const funnel = mesh(new THREE.CylinderGeometry(0.1, 0.12, 0.32, 10), mat(0xd23b3b));
  funnel.position.set(0.25, 0.86, 0); g.add(funnel);
  const mast = mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.6, 6), mat(0x222222));
  mast.position.set(0.0, 1.0, 0); g.add(mast);
  return g;
}

// Scottie Dog: stylized low-poly terrier.
function makeDog(color) {
  const g = new THREE.Group();
  const body = mesh(new THREE.BoxGeometry(0.85, 0.5, 0.45), mat(color));
  body.position.y = 0.5; g.add(body);
  const head = mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), mat(color));
  head.position.set(0.5, 0.7, 0); g.add(head);
  const snout = mesh(new THREE.BoxGeometry(0.22, 0.2, 0.28), mat(0x1a1a1a));
  snout.position.set(0.72, 0.62, 0); g.add(snout);
  // ears
  const earGeo = new THREE.ConeGeometry(0.1, 0.22, 6);
  const ear1 = mesh(earGeo, mat(0x4b2e10)); ear1.position.set(0.46, 0.95, 0.18); g.add(ear1);
  const ear2 = mesh(earGeo, mat(0x4b2e10)); ear2.position.set(0.46, 0.95, -0.18); g.add(ear2);
  // tail
  const tail = mesh(new THREE.ConeGeometry(0.08, 0.32, 6), mat(color));
  tail.rotation.z = Math.PI / 2.5;
  tail.position.set(-0.5, 0.65, 0); g.add(tail);
  // legs
  const legGeo = new THREE.BoxGeometry(0.14, 0.32, 0.14);
  [[0.3, 0.18, 0.16], [0.3, 0.18, -0.16], [-0.3, 0.18, 0.16], [-0.3, 0.18, -0.16]].forEach(([px,py,pz]) => {
    const l = mesh(legGeo, mat(0x4b2e10)); l.position.set(px, py, pz); g.add(l);
  });
  // eyes
  const eye = mesh(new THREE.SphereGeometry(0.04, 6, 6), mat(0x111111, { emissive: 0x111111 }));
  eye.position.set(0.62, 0.8, 0.14); g.add(eye);
  const eye2 = mesh(new THREE.SphereGeometry(0.04, 6, 6), mat(0x111111, { emissive: 0x111111 }));
  eye2.position.set(0.62, 0.8, -0.14); g.add(eye2);
  return g;
}

// Boot: a tall boot silhouette.
function makeBoot(color) {
  const g = new THREE.Group();
  const shaft = mesh(new THREE.BoxGeometry(0.45, 0.7, 0.5), mat(color));
  shaft.position.set(-0.15, 0.55, 0); g.add(shaft);
  const foot = mesh(new THREE.BoxGeometry(0.85, 0.25, 0.55), mat(color));
  foot.position.set(0.15, 0.22, 0); g.add(foot);
  const toe = mesh(new THREE.BoxGeometry(0.25, 0.18, 0.55), mat(color));
  toe.position.set(0.5, 0.18, 0); g.add(toe);
  // top opening
  const top = mesh(new THREE.BoxGeometry(0.47, 0.06, 0.52), mat(0x111111));
  top.position.set(-0.15, 0.93, 0); g.add(top);
  // sole
  const sole = mesh(new THREE.BoxGeometry(0.9, 0.06, 0.6), mat(0x111111));
  sole.position.set(0.12, 0.06, 0); g.add(sole);
  return g;
}

// Wheelbarrow: a tray + wheel + two legs.
function makeWheel(color) {
  const g = new THREE.Group();
  const trayGeo = new THREE.BoxGeometry(0.85, 0.18, 0.55);
  const tray = mesh(trayGeo, mat(color));
  tray.position.set(-0.1, 0.55, 0); g.add(tray);
  // tray sides (angled walls) — approximate with thin boxes
  const side = mesh(new THREE.BoxGeometry(0.85, 0.32, 0.06), mat(color));
  side.position.set(-0.1, 0.72, 0.28); g.add(side);
  const side2 = mesh(new THREE.BoxGeometry(0.85, 0.32, 0.06), mat(color));
  side2.position.set(-0.1, 0.72, -0.28); g.add(side2);
  // handles
  const handleGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.55, 8);
  const h1 = mesh(handleGeo, mat(0x6b4423));
  h1.rotation.z = Math.PI / 2;
  h1.position.set(-0.5, 0.5, 0.2); g.add(h1);
  const h2 = mesh(handleGeo, mat(0x6b4423));
  h2.rotation.z = Math.PI / 2;
  h2.position.set(-0.5, 0.5, -0.2); g.add(h2);
  // wheel
  const wheel = mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.1, 14), mat(0x111111));
  wheel.rotation.x = Math.PI / 2;
  wheel.position.set(0.3, 0.22, 0); g.add(wheel);
  // legs
  const legGeo = new THREE.BoxGeometry(0.06, 0.32, 0.06);
  const l1 = mesh(legGeo, mat(0x6b4423)); l1.position.set(-0.45, 0.28, 0.22); g.add(l1);
  const l2 = mesh(legGeo, mat(0x6b4423)); l2.position.set(-0.45, 0.28, -0.22); g.add(l2);
  return g;
}

const FACTORIES = {
  hat:  makeHat,
  car:  makeCar,
  ship: makeShip,
  dog:  makeDog,
  boot: makeBoot,
  wheel: makeWheel,
};

function createToken(id, hexColor) {
  const factory = FACTORIES[id] || makeHat;
  const g = factory(hexColor);
  // tint: re-color all top-level material colors to the player's color, but keep
  // the dark accents (wheels, eyes, etc.) so tokens remain recognizable. We do
  // this by only tinting the largest mesh in each token (the body).
  // For simplicity we leave the factory colors as-is — each token has a
  // distinctive shape and the player's color is shown by the base ring.
  // Add a glowing base ring in the player's color so tokens are easy to track.
  const ring = mesh(
    new THREE.TorusGeometry(0.55, 0.06, 8, 24),
    new THREE.MeshStandardMaterial({ color: hexColor, emissive: hexColor, emissiveIntensity: 0.6, roughness: 0.4 })
  );
  ring.rotation.x = Math.PI / 2;
  ring.position.y = 0.02;
  g.add(ring);
  return g;
}


// ===== js/rules.js =====
// rules.js — pure Monopoly rules engine.
// Every function takes a serializable `state` (and optional action) and returns
// a NEW state (immutably where practical) plus an `events` array describing
// what happened, so the UI can play sounds / show modals / animate tokens.
//
// State is plain JSON — directly broadcastable over PeerJS and storable in
// localStorage. No THREE objects live here.
//
// State shape:
//   players: [{ id, name, token, color, cash, position, inJail, jailTurns,
//               bankrupt, getOutCards }]
//   currentPlayerIndex: number
//   dice: [d1, d2] | null
//   rolledThisTurn: bool
//   doublesCount: number
//   phase: 'roll' | 'await-decision' | 'auction' | 'morelikelameover'
//   pending: null | { kind, ... }   // what the current player must decide
//   properties: { [pos]: { owner, houses, mortgaged } }   // houses 0..5, 5 = hotel
//   chanceOrder: [cardIds], chanceIdx
//   chestOrder:  [cardIds], chestIdx
//   houses: number (bank pool, starts 32)
//   hotels: number (bank pool, starts 12)
//   auction: null | { pos, bidders:[ids], currentIndex, highBid, highBidder, passed:[ids], done }
//   log: [{ t, msg }]
//   turn: number
//   winner: null | playerId
//   lastUpdate: number



const CARD_BY_ID = {};
[...CHANCE_CARDS, ...CHEST_CARDS].forEach(c => { CARD_BY_ID[c.id] = c; });

function shuffle(arr, rng = Math.random) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function initialState() {
  return {
    players: [],
    currentPlayerIndex: 0,
    dice: null,
    rolledThisTurn: false,
    doublesCount: 0,
    phase: 'lobby',
    pending: null,
    properties: {},
    chanceOrder: shuffle(CHANCE_CARDS.map(c => c.id)),
    chestOrder:  shuffle(CHEST_CARDS.map(c => c.id)),
    chanceIdx: 0,
    chestIdx: 0,
    houses: HOUSE_BANK,
    hotels: HOTEL_BANK,
    auction: null,
    log: [],
    turn: 0,
    winner: null,
    lastUpdate: Date.now(),
  };
}

function log(state, msg) {
  state.log.push({ t: Date.now(), msg });
  if (state.log.length > 200) state.log.shift();
}

function clone(state) {
  // Shallow-ish clone that's enough for our purposes: we replace nested fields
  // explicitly where we mutate them.
  return JSON.parse(JSON.stringify(state));
}

function activePlayers(state) {
  return state.players.filter(p => !p.bankrupt);
}

function currentPlayer(state) {
  return state.players[state.currentPlayerIndex];
}

function ownsColorSet(state, playerId, group) {
  const members = BOARD.filter(s => s.group === group);
  return members.every(s => state.properties[s.pos]?.owner === playerId);
}

function countRailsOwned(state, playerId) {
  return BOARD.filter(s => s.type === 'rail' && state.properties[s.pos]?.owner === playerId).length;
}

function countUtilsOwned(state, playerId) {
  return BOARD.filter(s => s.type === 'utility' && state.properties[s.pos]?.owner === playerId).length;
}

// Net worth used for bankruptcy / income-tax percent option.
function netWorth(state, playerId) {
  const p = state.players.find(pl => pl.id === playerId);
  if (!p) return 0;
  let total = p.cash;
  for (const s of BOARD) {
    const prop = state.properties[s.pos];
    if (!prop || prop.owner !== playerId) continue;
    if (s.price) total += Math.floor(s.price / 2); // mortgage value
    if (s.house) {
      total += prop.houses * Math.floor(s.house / 2);
    }
  }
  return total;
}

// --- morelikelame start ------------------------------------------------------------
function startmorelikelame(state, players) {
  const s = clone(state);
  s.players = players.map((p, i) => ({
    id: p.id,
    name: p.name || ('Player ' + (i + 1)),
    token: p.token,
    color: p.color,
    cash: START_CASH,
    position: 0,
    inJail: false,
    jailTurns: 0,
    bankrupt: false,
    getOutCards: 0,
  }));
  s.currentPlayerIndex = 0;
  s.dice = null;
  s.rolledThisTurn = false;
  s.doublesCount = 0;
  s.phase = 'roll';
  s.pending = null;
  s.auction = null;
  s.properties = {};
  s.houses = HOUSE_BANK;
  s.hotels = HOTEL_BANK;
  s.turn = 1;
  s.winner = null;
  log(s, `morelikelame started with ${s.players.length} players.`);
  return { state: s, events: [{ type: 'start' }] };
}

// --- Dice ------------------------------------------------------------------
function rollDice() { return [1 + Math.floor(Math.random() * 6), 1 + Math.floor(Math.random() * 6)]; }

// --- Movement --------------------------------------------------------------
function movePlayer(s, playerId, steps, opts = {}) {
  const p = s.players.find(pl => pl.id === playerId);
  if (!p) return [];
  const events = [];
  const startPos = p.position;
  let pos = startPos;
  for (let i = 0; i < steps; i++) {
    pos = (pos + 1) % 40;
    if (pos === 0 && !opts.noGoSalary) {
      p.cash += GO_SALARY;
      events.push({ type: 'pass-go', playerId });
    }
  }
  // For card moves to a specific position, also pay GO salary if passing GO.
  if (opts.toExact && steps < 0) {
    // moving backwards (back:N card): no GO salary
  }
  p.position = pos;
  events.push({ type: 'move', playerId, from: startPos, to: pos });
  return events;
}

function sendToJail(s, playerId) {
  const p = s.players.find(pl => pl.id === playerId);
  if (!p) return;
  p.position = 10;
  p.inJail = true;
  p.jailTurns = 0;
}

// --- Rent ------------------------------------------------------------------
function computeRent(state, pos, diceTotal) {
  const s = BOARD[pos];
  const prop = state.properties[pos];
  if (!prop || prop.owner == null || prop.mortgaged) return 0;
  if (s.type === 'property') {
    if (prop.houses > 0) return s.rent[prop.houses];
    if (ownsColorSet(state, prop.owner, s.group)) return s.rent[0] * 2;
    return s.rent[0];
  }
  if (s.type === 'rail') {
    const n = countRailsOwned(state, prop.owner);
    return [0, 25, 50, 100, 200][n] || 25;
  }
  if (s.type === 'utility') {
    const n = countUtilsOwned(state, prop.owner);
    return (n === 2 ? 10 : 4) * diceTotal;
  }
  return 0;
}

// --- Bankruptcy ------------------------------------------------------------
// Returns events; mutates s.
function settleDebt(s, debtorId, creditorId, amount, events) {
  const debtor = s.players.find(p => p.id === debtorId);
  if (!debtor) return;
  const creditor = creditorId ? s.players.find(p => p.id === creditorId) : null;

  // First use cash on hand.
  if (debtor.cash >= amount) {
    debtor.cash -= amount;
    if (creditor) creditor.cash += amount;
    events.push({ type: 'pay', from: debtorId, to: creditorId, amount, reason: 'debt' });
    return;
  }

  // Try to sell houses / mortgage to raise cash — we let the UI handle this
  // interactively. For now, if the debtor can't cover after using all cash and
  // we're forcing bankruptcy, transfer everything.
  // Mark debtor as bankrupt.
  const owed = amount - debtor.cash;
  const cashOnHand = debtor.cash;
  debtor.cash = 0;
  if (creditor) creditor.cash += cashOnHand;

  // Transfer all properties to creditor (or bank if creditorId is null)
  for (const sp of BOARD) {
    const prop = s.properties[sp.pos];
    if (prop && prop.owner === debtorId) {
      // sell houses back to bank at half price before transfer
      if (sp.house && prop.houses > 0) {
        const refund = prop.houses * Math.floor(sp.house / 2);
        if (creditor) creditor.cash += refund;
        if (prop.houses === 5) s.hotels += 1; else s.houses += prop.houses;
        prop.houses = 0;
      }
      prop.owner = creditorId; // may be null -> bank
      if (!creditorId) prop.mortgaged = true; // bank-owned properties stay mortgaged & inactive
      else prop.mortgaged = false; // creditor takes free of mortgages? Classic: creditor must pay 10% transfer if mortgaged. Simplified: unmortgage automatically.
    }
  }
  // Transfer get-out-of-jail cards to creditor or discard
  if (creditor) creditor.getOutCards += debtor.getOutCards;
  debtor.getOutCards = 0;
  debtor.bankrupt = true;
  events.push({ type: 'bankrupt', playerId: debtorId, creditorId, owed });
  log(s, `${debtor.name} went bankrupt.`);
}

// --- Resolve landing on a space -------------------------------------------
// Returns events. May set s.pending for player decisions.
function resolveLanding(s, playerId, diceTotal, events) {
  const p = s.players.find(pl => pl.id === playerId);
  if (!p) return;
  const sp = BOARD[p.position];
  const prop = s.properties[p.position];

  if (sp.type === 'go') {
    // GO salary already paid on pass; nothing extra for landing.
    return;
  }
  if (sp.type === 'jail') {
    // Just visiting — nothing.
    return;
  }
  if (sp.type === 'parking') {
    // Classic: nothing happens. (No house-rule pot.)
    return;
  }
  if (sp.type === 'gotojail') {
    sendToJail(s, playerId);
    events.push({ type: 'gotojail', playerId });
    log(s, `${p.name} was sent to Jail.`);
    return;
  }
  if (sp.type === 'tax') {
    if (sp.amount === 200) {
      // Income tax: player chooses $200 flat or 10% of net worth.
      s.pending = { kind: 'income-tax', playerId };
      s.phase = 'await-decision';
      events.push({ type: 'await', playerId, reason: 'income-tax' });
    } else {
      // Luxury tax: fixed $75.
      if (p.cash >= sp.amount) {
        p.cash -= sp.amount;
        events.push({ type: 'pay', from: playerId, to: null, amount: sp.amount, reason: 'luxury-tax' });
      } else {
        settleDebt(s, playerId, null, sp.amount, events);
      }
    }
    return;
  }
  if (sp.type === 'chest' || sp.type === 'chance') {
    drawCard(s, playerId, sp.type, diceTotal, events);
    return;
  }
  // Property / rail / utility
  if (!prop || prop.owner == null) {
    // Unowned: player may buy or trigger auction.
    s.pending = { kind: 'buy-or-auction', playerId, pos: p.position };
    s.phase = 'await-decision';
    events.push({ type: 'await', playerId, reason: 'buy-or-auction', pos: p.position });
    return;
  }
  if (prop.owner === playerId) return;
  if (prop.mortgaged) return; // no rent on mortgaged property
  const rent = computeRent(s, p.position, diceTotal);
  if (rent <= 0) return;
  if (p.cash >= rent) {
    p.cash -= rent;
    const owner = s.players.find(pl => pl.id === prop.owner);
    if (owner) owner.cash += rent;
    events.push({ type: 'pay', from: playerId, to: prop.owner, amount: rent, reason: 'rent', pos: p.position });
    log(s, `${p.name} paid $${rent} rent to ${owner ? owner.name : 'owner'}.`);
  } else {
    settleDebt(s, playerId, prop.owner, rent, events);
  }
}

// --- Cards -----------------------------------------------------------------
function drawCard(s, playerId, deck, diceTotal, events) {
  const order = deck === 'chance' ? s.chanceOrder : s.chestOrder;
  let idx = deck === 'chance' ? s.chanceIdx : s.chestIdx;
  const id = order[idx];
  idx = (idx + 1) % order.length;
  if (deck === 'chance') s.chanceIdx = idx; else s.chestIdx = idx;
  const card = CARD_BY_ID[id];
  if (!card) return;
  events.push({ type: 'card', deck, cardId: id, playerId });
  const p = s.players.find(pl => pl.id === playerId);
  log(s, `${p.name} drew: ${card.text}`);
  executeCard(s, playerId, card, diceTotal, events);
}

function nearest(s, pos, type) {
  // find next pos of given type strictly after pos (wrapping)
  for (let i = 1; i <= 40; i++) {
    const candidate = (pos + i) % 40;
    if (BOARD[candidate].type === type) return candidate;
  }
  return pos;
}

function executeCard(s, playerId, card, diceTotal, events) {
  const p = s.players.find(pl => pl.id === playerId);
  const a = card.action;
  switch (a.kind) {
    case 'move': {
      if (typeof a.to === 'number') {
        const target = a.to;
        if (target < p.position) {
          // passed GO
          p.cash += GO_SALARY;
          events.push({ type: 'pass-go', playerId });
        }
        const from = p.position;
        p.position = target;
        events.push({ type: 'move', playerId, from, to: target, instant: true });
        log(s, `${p.name} advanced to ${BOARD[target].name}.`);
        resolveLanding(s, playerId, diceTotal, events);
      } else if (typeof a.to === 'string' && a.to.startsWith('nearest:')) {
        const type = a.to.split(':')[1] === 'util' ? 'utility' : 'rail';
        const target = nearest(s, p.position, type);
        if (target < p.position) {
          p.cash += GO_SALARY;
          events.push({ type: 'pass-go', playerId });
        }
        const from = p.position;
        p.position = target;
        events.push({ type: 'move', playerId, from, to: target, instant: true });
        log(s, `${p.name} advanced to nearest ${type}: ${BOARD[target].name}.`);
        // Special rent rules per the card text.
        const sp = BOARD[target];
        const prop = s.properties[target];
        if (prop && prop.owner != null && prop.owner !== playerId && !prop.mortgaged) {
          let rent;
          if (type === 'rail') rent = 2 * ([0,25,50,100,200][countRailsOwned(s, prop.owner)] || 25);
          else rent = 10 * diceTotal;
          if (p.cash >= rent) {
            p.cash -= rent;
            const owner = s.players.find(pl => pl.id === prop.owner);
            if (owner) owner.cash += rent;
            events.push({ type: 'pay', from: playerId, to: prop.owner, amount: rent, reason: 'card-rent', pos: target });
          } else {
            settleDebt(s, playerId, prop.owner, rent, events);
          }
        } else if (!prop || prop.owner == null) {
          // unowned: player may buy
          s.pending = { kind: 'buy-or-auction', playerId, pos: target };
          s.phase = 'await-decision';
          events.push({ type: 'await', playerId, reason: 'buy-or-auction', pos: target });
        }
      } else if (typeof a.to === 'string' && a.to.startsWith('back:')) {
        const n = parseInt(a.to.split(':')[1], 10);
        const from = p.position;
        let target = (p.position - n + 40) % 40;
        p.position = target;
        events.push({ type: 'move', playerId, from, to: target, instant: true });
        log(s, `${p.name} went back ${n} spaces to ${BOARD[target].name}.`);
        resolveLanding(s, playerId, diceTotal, events);
      }
      break;
    }
    case 'collect':
      p.cash += a.amount;
      events.push({ type: 'collect', playerId, amount: a.amount });
      break;
    case 'pay':
      if (p.cash >= a.amount) {
        p.cash -= a.amount;
        events.push({ type: 'pay', from: playerId, to: null, amount: a.amount, reason: 'card' });
      } else settleDebt(s, playerId, null, a.amount, events);
      break;
    case 'collectFromEach':
      for (const other of s.players) {
        if (other.id === playerId || other.bankrupt) continue;
        const amt = Math.min(a.amount, other.cash);
        other.cash -= amt;
        p.cash += amt;
        if (amt > 0) events.push({ type: 'pay', from: other.id, to: playerId, amount: amt, reason: 'card-each' });
      }
      events.push({ type: 'collect', playerId, amount: a.amount, note: 'from each player' });
      break;
    case 'payEach':
      for (const other of s.players) {
        if (other.id === playerId || other.bankrupt) continue;
        if (p.cash >= a.amount) {
          p.cash -= a.amount;
          other.cash += a.amount;
          events.push({ type: 'pay', from: playerId, to: other.id, amount: a.amount, reason: 'card-each' });
        } else {
          settleDebt(s, playerId, other.id, a.amount, events);
          if (p.bankrupt) break;
        }
      }
      break;
    case 'gooj':
      p.getOutCards += 1;
      events.push({ type: 'gooj', playerId });
      break;
    case 'repairs': {
      let houses = 0, hotels = 0;
      for (const sp of BOARD) {
        const prop = s.properties[sp.pos];
        if (prop && prop.owner === playerId) {
          if (prop.houses === 5) hotels++;
          else houses += prop.houses;
        }
      }
      const owed = houses * a.house + hotels * a.hotel;
      if (owed > 0) {
        if (p.cash >= owed) {
          p.cash -= owed;
          events.push({ type: 'pay', from: playerId, to: null, amount: owed, reason: 'repairs' });
        } else settleDebt(s, playerId, null, owed, events);
      }
      break;
    }
    case 'toJail':
      sendToJail(s, playerId);
      events.push({ type: 'gotojail', playerId });
      log(s, `${p.name} was sent to Jail.`);
      break;
  }
}

// --- Roll ------------------------------------------------------------------
function rollAction(state) {
  let s = clone(state);
  const events = [];
  const p = currentPlayer(s);
  if (!p) return { state, events };
  if (s.rolledThisTurn) {
    events.push({ type: 'error', msg: 'Already rolled this turn.' });
    return { state, events };
  }
  const dice = rollDice();
  s.dice = dice;
  s.rolledThisTurn = true;
  const total = dice[0] + dice[1];
  const isDoubles = dice[0] === dice[1];
  events.push({ type: 'dice', d1: dice[0], d2: dice[1], playerId: p.id });
  log(s, `${p.name} rolled ${dice[0]} + ${dice[1]} = ${total}.`);

  if (p.inJail) {
    if (isDoubles) {
      p.inJail = false;
      p.jailTurns = 0;
      log(s, `${p.name} rolled doubles and leaves Jail.`);
      // Move but do NOT roll again (per rules, doubles exiting jail doesn't grant another roll).
      const moveEv = movePlayer(s, p.id, total);
      events.push(...moveEv);
      resolveLanding(s, p.id, total, events);
    } else {
      p.jailTurns += 1;
      if (p.jailTurns >= JAIL_TURNS) {
        // Must pay $50 and move.
        if (p.cash >= JAIL_FINE || p.getOutCards > 0) {
          if (p.getOutCards > 0) {
            p.getOutCards -= 1;
            // returned to bottom of deck
            returnGooj(s, 'chance');
            events.push({ type: 'gooj-used', playerId: p.id });
          } else {
            p.cash -= JAIL_FINE;
            events.push({ type: 'pay', from: p.id, to: null, amount: JAIL_FINE, reason: 'jail-fine' });
          }
          p.inJail = false;
          p.jailTurns = 0;
          const moveEv = movePlayer(s, p.id, total);
          events.push(...moveEv);
          resolveLanding(s, p.id, total, events);
        } else {
          // Can't pay — bankrupt to bank.
          settleDebt(s, p.id, null, JAIL_FINE, events);
        }
      } else {
        log(s, `${p.name} stays in Jail (turn ${p.jailTurns} of ${JAIL_TURNS}).`);
        events.push({ type: 'jail-stay', playerId: p.id, turns: p.jailTurns });
      }
    }
    } else {
      if (isDoubles) {
        s.doublesCount += 1;
        if (s.doublesCount >= 3) {
          log(s, `${p.name} rolled three doubles in a row — go to Jail!`);
          sendToJail(s, p.id);
          s.doublesCount = 0;
          events.push({ type: 'gotojail', playerId: p.id, reason: 'three-doubles' });
          // turn ends after dice display
          return finishTurnMaybe(s, events);
        }
      } else {
        s.doublesCount = 0;
      }
      const moveEv = movePlayer(s, p.id, total);
      events.push(...moveEv);
      resolveLanding(s, p.id, total, events);
      // After a non-jail doubles roll (1st or 2nd), the player rolls again.
      if (isDoubles && !s.pending) {
        s.rolledThisTurn = false;
        events.push({ type: 'doubles-again', playerId: p.id, count: s.doublesCount });
        log(s, `${p.name} rolled doubles and gets another roll.`);
      } else if (isDoubles && s.pending) {
        // Pending decision (buy/tax) — still allow another roll after resolving.
        s.rolledThisTurn = false;
        events.push({ type: 'doubles-again', playerId: p.id, count: s.doublesCount });
      }
    }

  s = finishTurnMaybe(s, events).state || s;
  s.lastUpdate = Date.now();
  return { state: s, events };
}

function returnGooj(s, deck) {
  // Return a get-out-of-jail-free card to the bottom of its deck. We don't
  // track which deck a kept card came from, so we just push to chance.
  // (Classic rule: chance gooj returns to chance, chest to chest. Simplified.)
  if (deck === 'chest') {
    s.chestOrder.push('cc4');
  } else {
    s.chanceOrder.push('ch7');
  }
}

// If no pending decision and no auction and the player didn't roll doubles
// (or is in jail waiting), the turn ends automatically only after the player
// explicitly ends it. We keep turns explicit so players can build/trade/etc.
function finishTurnMaybe(s, events) {
  // We do NOT auto-advance the turn here; the player must call end-turn
  // (unless sent to jail for three doubles, in which case we still require
  // an explicit end-turn to show the dice). So this is a no-op kept for clarity.
  return { state: s, events };
}

// --- Buy / Auction ---------------------------------------------------------
function buyAction(state, playerId) {
  let s = clone(state);
  const events = [];
  const p = s.players.find(pl => pl.id === playerId);
  if (!p || !s.pending || s.pending.kind !== 'buy-or-auction' || s.pending.playerId !== playerId) {
    events.push({ type: 'error', msg: 'Nothing to buy.' });
    return { state, events };
  }
  const sp = BOARD[s.pending.pos];
  if (p.cash < sp.price) {
    events.push({ type: 'error', msg: 'Not enough cash.' });
    return { state, events };
  }
  p.cash -= sp.price;
  s.properties[s.pending.pos] = { owner: playerId, houses: 0, mortgaged: false };
  events.push({ type: 'buy', playerId, pos: s.pending.pos, price: sp.price });
  log(s, `${p.name} bought ${sp.name} for $${sp.price}.`);
  s.pending = null;
  s.phase = 'roll';
  // After buying, the player's turn continues (must still end-turn).
  // But if they rolled non-doubles, they should end turn. We leave it to UI.
  s.lastUpdate = Date.now();
  return { state: s, events };
}

function declineBuyAction(state, playerId) {
  // Decline to buy -> start an auction.
  let s = clone(state);
  const events = [];
  if (!s.pending || s.pending.kind !== 'buy-or-auction' || s.pending.playerId !== playerId) {
    events.push({ type: 'error', msg: 'Nothing to decline.' });
    return { state, events };
  }
  const pos = s.pending.pos;
  s.pending = null;
  const bidders = s.players.filter(p => !p.bankrupt).map(p => p.id);
  s.auction = {
    pos,
    bidders,
    currentIndex: 0,
    highBid: 0,
    highBidder: null,
    passed: [],
    minBid: 1,
  };
  s.phase = 'auction';
  events.push({ type: 'auction-start', pos });
  log(s, `Auction started for ${BOARD[pos].name}.`);
  s.lastUpdate = Date.now();
  return { state: s, events };
}

function bidAction(state, playerId, amount) {
  let s = clone(state);
  const events = [];
  const a = s.auction;
  if (!a) { events.push({ type: 'error', msg: 'No auction.' }); return { state, events }; }
  const bidder = s.players.find(p => p.id === playerId);
  if (!bidder || bidder.bankrupt) { events.push({ type: 'error', msg: 'Cannot bid.' }); return { state, events }; }
  if (amount <= a.highBid) { events.push({ type: 'error', msg: 'Bid must exceed current high bid.' }); return { state, events }; }
  // The bidder must have enough cash to cover the bid (they pay if they win).
  if (amount > bidder.cash) { events.push({ type: 'error', msg: 'Not enough cash for that bid.' }); return { state, events }; }
  a.highBid = amount;
  a.highBidder = playerId;
  events.push({ type: 'bid', playerId, amount });
  advanceAuction(s, events);
  s.lastUpdate = Date.now();
  return { state: s, events };
}

function passBidAction(state, playerId) {
  let s = clone(state);
  const events = [];
  const a = s.auction;
  if (!a) { events.push({ type: 'error', msg: 'No auction.' }); return { state, events }; }
  if (!a.passed.includes(playerId)) a.passed.push(playerId);
  events.push({ type: 'pass', playerId });
  advanceAuction(s, events);
  s.lastUpdate = Date.now();
  return { state: s, events };
}

function advanceAuction(s, events) {
  const a = s.auction;
  const remaining = a.bidders.filter(id => !a.passed.includes(id));
  if (remaining.length <= 1) {
    // settle
    const winnerId = remaining[0] || a.highBidder;
    if (winnerId && a.highBid > 0) {
      const winner = s.players.find(p => p.id === winnerId);
      winner.cash -= a.highBid;
      s.properties[a.pos] = { owner: winnerId, houses: 0, mortgaged: false };
      events.push({ type: 'auction-won', playerId: winnerId, pos: a.pos, amount: a.highBid });
      log(s, `${winner.name} won ${BOARD[a.pos].name} at auction for $${a.highBid}.`);
    } else {
      events.push({ type: 'auction-end', pos: a.pos, winnerId: null });
      log(s, `Auction for ${BOARD[a.pos].name} ended with no buyer.`);
    }
    s.auction = null;
    s.phase = 'roll';
  } else {
    // advance currentIndex to next remaining bidder
    const startIdx = a.currentIndex;
    for (let i = 1; i <= a.bidders.length; i++) {
      const idx = (startIdx + i) % a.bidders.length;
      if (!a.passed.includes(a.bidders[idx])) {
        a.currentIndex = idx;
        break;
      }
    }
    events.push({ type: 'auction-turn', playerId: a.bidders[a.currentIndex] });
  }
}

// --- Income tax ------------------------------------------------------------
function incomeTaxAction(state, playerId, choice) {
  let s = clone(state);
  const events = [];
  if (!s.pending || s.pending.kind !== 'income-tax' || s.pending.playerId !== playerId) {
    events.push({ type: 'error', msg: 'No tax decision pending.' });
    return { state, events };
  }
  const p = s.players.find(pl => pl.id === playerId);
  if (choice === 'flat') {
    p.cash -= 200;
    events.push({ type: 'pay', from: playerId, to: null, amount: 200, reason: 'income-tax-flat' });
    log(s, `${p.name} paid $200 income tax.`);
  } else {
    const nw = netWorth(s, playerId);
    const amt = Math.floor(nw * 0.10);
    if (p.cash >= amt) {
      p.cash -= amt;
      events.push({ type: 'pay', from: playerId, to: null, amount: amt, reason: 'income-tax-pct' });
    } else settleDebt(s, playerId, null, amt, events);
    log(s, `${p.name} paid 10% ($${amt}) income tax.`);
  }
  s.pending = null;
  s.phase = 'roll';
  s.lastUpdate = Date.now();
  return { state: s, events };
}

// --- Jail actions ----------------------------------------------------------
function jailFineAction(state, playerId) {
  let s = clone(state);
  const events = [];
  const p = s.players.find(pl => pl.id === playerId);
  if (!p || !p.inJail) { events.push({ type: 'error', msg: 'Not in jail.' }); return { state, events }; }
  if (s.rolledThisTurn) { events.push({ type: 'error', msg: 'Already rolled.' }); return { state, events }; }
  if (p.cash < JAIL_FINE) { events.push({ type: 'error', msg: 'Not enough cash.' }); return { state, events }; }
  p.cash -= JAIL_FINE;
  p.inJail = false;
  p.jailTurns = 0;
  events.push({ type: 'pay', from: playerId, to: null, amount: JAIL_FINE, reason: 'jail-fine' });
  log(s, `${p.name} paid $50 to leave Jail.`);
  s.lastUpdate = Date.now();
  return { state: s, events };
}

function jailGoojAction(state, playerId) {
  let s = clone(state);
  const events = [];
  const p = s.players.find(pl => pl.id === playerId);
  if (!p || !p.inJail) { events.push({ type: 'error', msg: 'Not in jail.' }); return { state, events }; }
  if (p.getOutCards <= 0) { events.push({ type: 'error', msg: 'No Get Out of Jail Free card.' }); return { state, events }; }
  p.getOutCards -= 1;
  returnGooj(s, 'chance');
  p.inJail = false;
  p.jailTurns = 0;
  events.push({ type: 'gooj-used', playerId });
  log(s, `${p.name} used a Get Out of Jail Free card.`);
  s.lastUpdate = Date.now();
  return { state: s, events };
}

// --- Houses / Hotels -------------------------------------------------------
function buyHouseAction(state, playerId, pos) {
  let s = clone(state);
  const events = [];
  const p = s.players.find(pl => pl.id === playerId);
  const sp = BOARD[pos];
  const prop = s.properties[pos];
  if (!p || !sp || sp.type !== 'property') { events.push({ type: 'error', msg: 'Cannot build here.' }); return { state, events }; }
  if (!prop || prop.owner !== playerId) { events.push({ type: 'error', msg: 'You do not own this property.' }); return { state, events }; }
  if (prop.houses >= 5) { events.push({ type: 'error', msg: 'Already has a hotel.' }); return { state, events }; }
  // Color set ownership
  if (!ownsColorSet(s, playerId, sp.group)) { events.push({ type: 'error', msg: 'You must own the full color set first.' }); return { state, events }; }
  // No mortgaged properties in the group
  const members = BOARD.filter(b => b.group === sp.group);
  if (members.some(m => s.properties[m.pos]?.mortgaged)) { events.push({ type: 'error', msg: 'Unmortgage all properties in the group first.' }); return { state, events }; }
  // Even building: this property's house count must be <= the minimum in the group.
  const minHouses = Math.min(...members.map(m => s.properties[m.pos]?.houses || 0));
  if (prop.houses > minHouses) { events.push({ type: 'error', msg: 'Build evenly across the color set.' }); return { state, events }; }
  // Bank pool
  if (prop.houses === 4 && s.hotels <= 0) { events.push({ type: 'error', msg: 'No hotels left in the bank.' }); return { state, events }; }
  if (prop.houses < 4 && s.houses <= 0) { events.push({ type: 'error', msg: 'No houses left in the bank.' }); return { state, events }; }
  // Cost
  if (p.cash < sp.house) { events.push({ type: 'error', msg: 'Not enough cash.' }); return { state, events }; }
  p.cash -= sp.house;
  prop.houses += 1;
  if (prop.houses === 5) { s.hotels -= 1; s.houses += 4; /* the 4 houses go back to the bank when hotel built */ }
  else s.houses -= 1;
  events.push({ type: 'house', playerId, pos, houses: prop.houses });
  log(s, `${p.name} built ${prop.houses === 5 ? 'a hotel' : 'a house'} on ${sp.name}.`);
  s.lastUpdate = Date.now();
  return { state: s, events };
}

function sellHouseAction(state, playerId, pos) {
  let s = clone(state);
  const events = [];
  const p = s.players.find(pl => pl.id === playerId);
  const sp = BOARD[pos];
  const prop = s.properties[pos];
  if (!prop || prop.owner !== playerId) { events.push({ type: 'error', msg: 'Not yours.' }); return { state, events }; }
  if (prop.houses <= 0) { events.push({ type: 'error', msg: 'No buildings to sell.' }); return { state, events }; }
  // Even selling: must sell from the most-improved property in the group first.
  const members = BOARD.filter(b => b.group === sp.group);
  const maxHouses = Math.max(...members.map(m => s.properties[m.pos]?.houses || 0));
  if (prop.houses < maxHouses) { events.push({ type: 'error', msg: 'Sell from the most-improved property first.' }); return { state, events }; }
  const refund = Math.floor(sp.house / 2);
  p.cash += refund;
  if (prop.houses === 5) {
    // selling a hotel: returns 4 houses to the property (or bank if insufficient)
    prop.houses = 4;
    s.hotels += 1;
    if (s.houses < 4) {
      // not enough houses in bank — per classic rules, can't sell hotel; simplified: sell anyway and leave at 4
    } else s.houses -= 4;
  } else {
    prop.houses -= 1;
    s.houses += 1;
  }
  events.push({ type: 'sell-house', playerId, pos, houses: prop.houses, refund });
  log(s, `${p.name} sold a building on ${sp.name} for $${refund}.`);
  s.lastUpdate = Date.now();
  return { state: s, events };
}

// --- Mortgage --------------------------------------------------------------
function mortgageAction(state, playerId, pos) {
  let s = clone(state);
  const events = [];
  const p = s.players.find(pl => pl.id === playerId);
  const sp = BOARD[pos];
  const prop = s.properties[pos];
  if (!prop || prop.owner !== playerId) { events.push({ type: 'error', msg: 'Not yours.' }); return { state, events }; }
  if (prop.mortgaged) { events.push({ type: 'error', msg: 'Already mortgaged.' }); return { state, events }; }
  // Must sell all houses in the group first.
  const members = BOARD.filter(b => b.group === sp.group);
  if (members.some(m => (s.properties[m.pos]?.houses || 0) > 0)) { events.push({ type: 'error', msg: 'Sell all buildings in the group first.' }); return { state, events }; }
  const val = Math.floor(sp.price / 2);
  p.cash += val;
  prop.mortgaged = true;
  events.push({ type: 'mortgage', playerId, pos, value: val });
  log(s, `${p.name} mortgaged ${sp.name} for $${val}.`);
  s.lastUpdate = Date.now();
  return { state: s, events };
}

function unmortgageAction(state, playerId, pos) {
  let s = clone(state);
  const events = [];
  const p = s.players.find(pl => pl.id === playerId);
  const sp = BOARD[pos];
  const prop = s.properties[pos];
  if (!prop || prop.owner !== playerId) { events.push({ type: 'error', msg: 'Not yours.' }); return { state, events }; }
  if (!prop.mortgaged) { events.push({ type: 'error', msg: 'Not mortgaged.' }); return { state, events }; }
  const cost = Math.ceil(Math.floor(sp.price / 2) * 1.10);
  if (p.cash < cost) { events.push({ type: 'error', msg: 'Not enough cash.' }); return { state, events }; }
  p.cash -= cost;
  prop.mortgaged = false;
  events.push({ type: 'unmortgage', playerId, pos, cost });
  log(s, `${p.name} unmortgaged ${sp.name} for $${cost}.`);
  s.lastUpdate = Date.now();
  return { state: s, events };
}

// --- Trade -----------------------------------------------------------------
// offer shape:
//   { from: playerId, to: playerId,
//     fromGives: { cash, properties: [pos], goojCards },
//     toGives:   { cash, properties: [pos], goojCards } }
function tradeAction(state, offer) {
  let s = clone(state);
  const events = [];
  const from = s.players.find(p => p.id === offer.from);
  const to   = s.players.find(p => p.id === offer.to);
  if (!from || !to) { events.push({ type: 'error', msg: 'Invalid trade parties.' }); return { state, events }; }
  if (from.cash < offer.fromGives.cash) { events.push({ type: 'error', msg: 'Not enough cash.' }); return { state, events }; }
  if (to.cash < offer.toGives.cash) { events.push({ type: 'error', msg: 'Not enough cash.' }); return { state, events }; }
  // validate ownership
  for (const pos of offer.fromGives.properties) if (s.properties[pos]?.owner !== offer.from) { events.push({ type: 'error', msg: 'Invalid property in trade.' }); return { state, events }; }
  for (const pos of offer.toGives.properties)   if (s.properties[pos]?.owner !== offer.to)   { events.push({ type: 'error', msg: 'Invalid property in trade.' }); return { state, events }; }
  if (from.getOutCards < (offer.fromGives.goojCards||0)) { events.push({ type: 'error', msg: 'Not enough GOOJ cards.' }); return { state, events }; }
  if (to.getOutCards < (offer.toGives.goojCards||0)) { events.push({ type: 'error', msg: 'Not enough GOOJ cards.' }); return { state, events }; }
  // execute
  from.cash -= offer.fromGives.cash; to.cash += offer.fromGives.cash;
  to.cash   -= offer.toGives.cash;   from.cash += offer.toGives.cash;
  for (const pos of offer.fromGives.properties) { s.properties[pos].owner = offer.to; }
  for (const pos of offer.toGives.properties)   { s.properties[pos].owner = offer.from; }
  from.getOutCards -= (offer.fromGives.goojCards||0); to.getOutCards += (offer.fromGives.goojCards||0);
  to.getOutCards   -= (offer.toGives.goojCards||0);   from.getOutCards += (offer.toGives.goojCards||0);
  events.push({ type: 'trade', offer });
  log(s, `Trade completed between ${from.name} and ${to.name}.`);
  s.lastUpdate = Date.now();
  return { state: s, events };
}

// --- End turn --------------------------------------------------------------
function endTurnAction(state) {
  let s = clone(state);
  const events = [];
  if (s.pending) { events.push({ type: 'error', msg: 'Resolve the pending action first.' }); return { state, events }; }
  if (s.auction) { events.push({ type: 'error', msg: 'Auction in progress.' }); return { state, events }; }
  // If the player rolled doubles (and isn't in jail), they must roll again —
  // we treat end-turn as an explicit choice only valid when not eligible to
  // roll again. But to keep UI simple, we always allow end-turn; doubles
  // simply let them roll again rather than forcing it.
  const p = currentPlayer(s);
  if (!p) return { state, events };

  // Advance to next non-bankrupt player.
  let next = (s.currentPlayerIndex + 1) % s.players.length;
  let safety = 0;
  while (s.players[next].bankrupt && safety < s.players.length) {
    next = (next + 1) % s.players.length;
    safety++;
  }
  s.currentPlayerIndex = next;
  s.dice = null;
  s.rolledThisTurn = false;
  s.doublesCount = 0;
  s.phase = 'roll';
  s.turn += 1;

  // Win check: only one non-bankrupt player left.
  const remaining = activePlayers(s);
  if (remaining.length === 1) {
    s.winner = remaining[0].id;
    s.phase = 'morelikelameover';
    events.push({ type: 'win', playerId: remaining[0].id });
    log(s, `${remaining[0].name} wins the morelikelame!`);
  }

  events.push({ type: 'turn', playerId: s.players[next].id });
  s.lastUpdate = Date.now();
  return { state: s, events };
}

// --- Dispatch --------------------------------------------------------------
function dispatch(state, action) {
  switch (action.kind) {
    case 'start':            return startmorelikelame(state, action.players);
    case 'roll':             return rollAction(state);
    case 'buy':              return buyAction(state, action.playerId);
    case 'decline-buy':      return declineBuyAction(state, action.playerId);
    case 'bid':              return bidAction(state, action.playerId, action.amount);
    case 'pass-bid':         return passBidAction(state, action.playerId);
    case 'income-tax':       return incomeTaxAction(state, action.playerId, action.choice);
    case 'jail-fine':        return jailFineAction(state, action.playerId);
    case 'jail-gooj':        return jailGoojAction(state, action.playerId);
    case 'buy-house':        return buyHouseAction(state, action.playerId, action.pos);
    case 'sell-house':       return sellHouseAction(state, action.playerId, action.pos);
    case 'mortgage':         return mortgageAction(state, action.playerId, action.pos);
    case 'unmortgage':       return unmortgageAction(state, action.playerId, action.pos);
    case 'trade':            return tradeAction(state, action.offer);
    case 'end-turn':         return endTurnAction(state);
    default:                 return { state, events: [{ type: 'error', msg: 'Unknown action ' + action.kind }] };
  }
}


// ===== js/board3d.js =====
// board3d.js — Three.js scene: 3D board, tiles, animated player tokens,
// rolling dice, and houses/hotels. Exposes a small API used by morelikelame.js/ui.js.






// Board geometry constants
const CORNER = 1.8;            // corner tile size (square)
const SIDE_W = 1.0;            // side tile width along the outer edge
const TILE_D = 1.8;            // tile depth from outer edge inward (matches corner)
const HALF   = CORNER/2 + 9*SIDE_W + CORNER/2;  // outer edge distance from center
const TILE_H = 0.18;           // tile thickness
const TOKEN_Y = 0.18;          // token base height above board

// Returns the world-space center (x, z) for a board position.
function tileCenter(pos) {
  const E = HALF;
  if (pos === 0)  return { x:  E - CORNER/2, z:  E - CORNER/2, side: 'br' };
