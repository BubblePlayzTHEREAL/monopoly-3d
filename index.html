  if (pos === 10) return { x: -(E - CORNER/2), z:  E - CORNER/2, side: 'bl' };
  if (pos === 20) return { x: -(E - CORNER/2), z: -(E - CORNER/2), side: 'tl' };
  if (pos === 30) return { x:  E - CORNER/2, z: -(E - CORNER/2), side: 'tr' };
  if (pos >= 1 && pos <= 9) {
    // bottom row, going right-to-left
    const x = (E - CORNER/2 - SIDE_W/2) - (pos - 1) * SIDE_W;
    return { x, z: E - TILE_D/2, side: 'bottom' };
  }
  if (pos >= 11 && pos <= 19) {
    // left column, going bottom-to-top
    const z = (E - CORNER/2 - SIDE_W/2) - (pos - 11) * SIDE_W;
    return { x: -(E - TILE_D/2), z, side: 'left' };
  }
  if (pos >= 21 && pos <= 29) {
    // top row, going left-to-right
    const x = -(E - CORNER/2 - SIDE_W/2) + (pos - 21) * SIDE_W;
    return { x, z: -(E - TILE_D/2), side: 'top' };
  }
  // right column, going top-to-bottom
  const z = -(E - CORNER/2 - SIDE_W/2) + (pos - 31) * SIDE_W;
  return { x: E - TILE_D/2, z, side: 'right' };
}

// Rotation (about Y) so the tile's texture "bar edge" faces outward.
function tileYRotation(side) {
  switch (side) {
    case 'bottom': return 0;
    case 'left':   return Math.PI / 2;
    case 'top':    return Math.PI;
    case 'right':  return -Math.PI / 2;
    default:       return 0; // corners
  }
}

// Slot offset for the Nth token sharing a tile (so they don't overlap).
function slotOffset(index, total) {
  const r = 0.28;
  if (total <= 1) return { dx: 0, dz: 0 };
  if (total === 2) return { dx: (index === 0 ? -r : r), dz: 0 };
  // 3+: arrange on a small circle
  const a = (index / total) * Math.PI * 2;
  return { dx: Math.cos(a) * r, dz: Math.sin(a) * r };
}

class Board3D {
  constructor() {
    this.container = null;
    this.tokenMeshes = new Map();   // playerId -> THREE.Group
    this.tileMeshes = [];           // pos -> mesh group
    this.houseGroups = new Map();   // pos -> THREE.Group holding house meshes
    this.diceMeshes = [];
    this.animations = [];           // active tweens
    this.highlight = null;
    this._lastStateTokens = new Map();
    this._initialised = false;
  }

  init(container) {
    if (this._initialised) {
      // already built — just reattach the canvas if needed and resize
      this.container = container;
      if (this.renderer && this.renderer.domElement.parentNode !== container) {
        container.appendChild(this.renderer.domElement);
      }
      this.resize();
      return;
    }
    this.container = container;
    this._initialised = true;
    this._initScene();
  }

  _initScene() {
    const w = this.container.clientWidth;
    const h = this.container.clientHeight;

    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x10131a);
    this.scene.fog = new THREE.Fog(0x10131a, 18, 38);

    this.camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100);
    this.camera.position.set(0, 13, 14);
    this.camera.lookAt(0, 0, 0);

    this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.setSize(w, h);
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.container.appendChild(this.renderer.domElement);

    // Lights
    const amb = new THREE.AmbientLight(0xffffff, 0.55);
    this.scene.add(amb);
    const key = new THREE.DirectionalLight(0xfff4e0, 1.1);
    key.position.set(8, 16, 10);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.near = 1;
    key.shadow.camera.far = 50;
    key.shadow.camera.left = -12;
    key.shadow.camera.right = 12;
    key.shadow.camera.top = 12;
    key.shadow.camera.bottom = -12;
    this.scene.add(key);
    const fill = new THREE.DirectionalLight(0xb0c4de, 0.35);
    fill.position.set(-8, 6, -6);
    this.scene.add(fill);

    // Ground
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(22, 48),
      new THREE.MeshStandardMaterial({ color: 0x1b2230, roughness: 0.95 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.3;
    ground.receiveShadow = true;
    this.scene.add(ground);

    this._buildBoard();
    this._buildCenter();
    this._buildDice();

    // Controls
    this.controls = new OrbitControls(this.camera, this.renderer.domElement);
    this.controls.enableDamping = true;
    this.controls.dampingFactor = 0.08;
    this.controls.minDistance = 9;
    this.controls.maxDistance = 26;
    this.controls.maxPolarAngle = Math.PI * 0.46;
    this.controls.target.set(0, 0, 0);

    this._clock = new THREE.Clock();
    this._running = true;
    this._loop = this._loop.bind(this);
    this._loop();

    window.addEventListener('resize', this._onResize = () => this.resize());
  }

  _buildBoard() {
    // Base slab
    const slab = new THREE.Mesh(
      new THREE.BoxGeometry(HALF * 2 + 0.4, 0.4, HALF * 2 + 0.4),
      new THREE.MeshStandardMaterial({ color: 0x2b1f14, roughness: 0.8 })
    );
    slab.position.y = -0.25;
    slab.receiveShadow = true;
    this.scene.add(slab);

    for (const space of BOARD) {
      const { x, z, side } = tileCenter(space.pos);
      const isCorner = space.type === 'go' || space.type === 'jail' ||
                       space.type === 'parking' || space.type === 'gotojail';
      const widthAlongEdge = isCorner ? CORNER : SIDE_W;
      const depth = TILE_D;

      // Base box
      const baseMat = new THREE.MeshStandardMaterial({ color: 0xf4ecd6, roughness: 0.85 });
      const base = new THREE.Mesh(
        new THREE.BoxGeometry(widthAlongEdge, TILE_H, depth),
        baseMat
      );
      base.position.set(x, 0, z);
      base.castShadow = true;
      base.receiveShadow = true;

      // Textured top face
      const topTex = tileTexture(space, side === 'bottom' ? 0 : side === 'left' ? 1 : side === 'top' ? 2 : 3);
      const topPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(widthAlongEdge, depth),
        new THREE.MeshStandardMaterial({ map: topTex, roughness: 0.7 })
      );
      topPlane.rotation.x = -Math.PI / 2;
      topPlane.rotation.z = tileYRotation(side);
      // Note: rotation.z on an already-X-rotated plane acts as a Y rotation in world space.
      topPlane.position.set(x, TILE_H / 2 + 0.002, z);
      topPlane.receiveShadow = true;

      const group = new THREE.Group();
      group.add(base);
      group.add(topPlane);
      group.userData = { pos: space.pos, side, center: { x, z } };
      this.scene.add(group);
      this.tileMeshes[space.pos] = group;

      // Houses container
      const housesGroup = new THREE.Group();
      housesGroup.position.set(x, TILE_H / 2 + 0.01, z);
      this.scene.add(housesGroup);
      this.houseGroups.set(space.pos, housesGroup);
    }
  }

  _buildCenter() {
    const size = (HALF - TILE_D) * 2; // inner square
    const tex = centerTexture();
    const plaque = new THREE.Mesh(
      new THREE.PlaneGeometry(size, size),
      new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6 })
    );
    plaque.rotation.x = -Math.PI / 2;
    plaque.position.y = 0.06;
    plaque.receiveShadow = true;
    this.scene.add(plaque);

    // a thin gold trim around the plaque
    const trim = new THREE.Mesh(
      new THREE.BoxGeometry(size + 0.25, 0.1, size + 0.25),
      new THREE.MeshStandardMaterial({ color: 0xb87333, roughness: 0.4, metalness: 0.6 })
    );
    trim.position.y = 0.02;
    this.scene.add(trim);
  }

  _buildDice() {
    const diceMat = new THREE.MeshStandardMaterial({ color: 0xf8f4ea, roughness: 0.4 });
    const size = 0.7;
    for (let i = 0; i < 2; i++) {
      const geo = new THREE.BoxGeometry(size, size, size);
      // Add pip decals via a canvas texture on each face
      const mesh = new THREE.Mesh(geo, [
        this._pipFace(2), this._pipFace(5), // +x, -x
        this._pipFace(3), this._pipFace(4), // +y, -y
        this._pipFace(1), this._pipFace(6), // +z, -z
      ]);
      mesh.castShadow = true;
      mesh.position.set(-0.6 + i * 1.2, 1.5, 0);
      mesh.userData.restPos = mesh.position.clone();
      mesh.userData.targetValue = 1;
      mesh.visible = false;
      this.scene.add(mesh);
      this.diceMeshes.push(mesh);
    }
  }

  _pipFace(value) {
    const c = document.createElement('canvas');
    c.width = 128; c.height = 128;
    const x = c.getContext('2d');
    x.fillStyle = '#f8f4ea';
    x.fillRect(0, 0, 128, 128);
    x.fillStyle = '#c0392b';
    const pos = {
      1: [[64, 64]],
      2: [[32, 32], [96, 96]],
      3: [[32, 32], [64, 64], [96, 96]],
      4: [[32, 32], [96, 32], [32, 96], [96, 96]],
      5: [[32, 32], [96, 32], [64, 64], [32, 96], [96, 96]],
      6: [[32, 24], [96, 24], [32, 64], [96, 64], [32, 104], [96, 104]],
    }[value];
    for (const [px, py] of pos) {
      x.beginPath();
      x.arc(px, py, 11, 0, Math.PI * 2);
      x.fill();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.anisotropy = 4;
    return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.4 });
  }

  // Show dice with given values, with a brief spin animation.
  showDice(d1, d2) {
    for (let i = 0; i < 2; i++) {
      const mesh = this.diceMeshes[i];
      mesh.visible = true;
      const value = i === 0 ? d1 : d2;
      mesh.userData.targetValue = value;
      // Spin then settle to a rotation that exposes the target face up (+y).
      const targetRot = this._diceRotationForValue(value);
      mesh.userData.spin = { start: performance.now(), duration: 700, target: targetRot };
    }
  }

  hideDice() {
    for (const mesh of this.diceMeshes) mesh.visible = false;
  }

  // Pick a rotation so the requested face points up (+Y).
  // Face material order for BoxGeometry: [px,nx,py,ny,pz,nz] with our values
  // assigned as [2,5,3,4,1,6] — so +Y is value 3, -Y is value 4, etc.
  _diceRotationForValue(value) {
    // We approximate by spinning to one of six fixed orientations. The exact
    // face-up is cosmetic; players read the value from the HUD too.
    const rots = {
      1: { x: -Math.PI / 2, y: 0, z: 0 },          // +z up
      2: { x: 0,            y: 0, z: Math.PI / 2 },
      3: { x: 0,            y: 0, z: 0 },          // +y up
      4: { x: Math.PI,      y: 0, z: 0 },
      5: { x: 0,            y: 0, z: -Math.PI / 2 },
      6: { x: Math.PI / 2,  y: 0, z: 0 },          // -z up
    };
    return rots[value] || rots[1];
  }

  setupPlayers(players) {
    // Idempotent: create missing token meshes, remove orphans. Existing
    // meshes are kept so in-flight tweens and the highlight ring survive.
    const seen = new Set();
    for (const p of players) {
      seen.add(p.id);
      if (this.tokenMeshes.has(p.id)) continue;
      const tok = createToken(p.token, p.color);
      const { x, z } = tileCenter(p.position ?? 0);
      tok.position.set(x, TOKEN_Y, z);
      this.scene.add(tok);
      this.tokenMeshes.set(p.id, tok);
    }
    for (const [id, m] of this.tokenMeshes) {
      if (!seen.has(id)) {
        this.scene.remove(m);
        this.tokenMeshes.delete(id);
      }
    }
  }

  // Tween tokens from their current mesh position to their state position
  // (straight-line arc with a small hop). Called on every state change.
  syncTokens(players) {
    const byPos = new Map();
    for (const p of players) {
      if (p.bankrupt) continue;
      const arr = byPos.get(p.position) || [];
      arr.push(p);
      byPos.set(p.position, arr);
    }
    for (const [pos, list] of byPos) {
      const { x, z } = tileCenter(pos);
      list.forEach((p, idx) => {
        const m = this.tokenMeshes.get(p.id);
        if (!m) return;
        const off = slotOffset(idx, list.length);
        this._tweenToken(m, x + off.dx, z + off.dz, 300);
      });
    }
    for (const p of players) {
      const m = this.tokenMeshes.get(p.id);
      if (m) m.visible = !p.bankrupt;
    }
  }

  _tweenToken(mesh, tx, tz, dur) {
    const from = mesh.position.clone();
    const dx = tx - from.x, dz = tz - from.z;
    if (Math.abs(dx) < 0.001 && Math.abs(dz) < 0.001) {
      mesh.position.set(tx, TOKEN_Y, tz);
      delete mesh.userData.tween;
      return;
    }
    mesh.userData.tween = { from, tx, tz, dx, dz, start: performance.now(), dur };
  }

  // Animate a token stepping through a list of positions (one tile per step).
  animateMove(playerId, positions, done) {
    const mesh = this.tokenMeshes.get(playerId);
    if (!mesh || positions.length === 0) { if (done) done(); return; }
    let step = 0;
    const stepDur = 220;
    const start = performance.now();
    const from = mesh.position.clone();
    const animate = () => {
      const elapsed = performance.now() - start;
      const idx = Math.min(positions.length, Math.floor(elapsed / stepDur));
      // current step
      const segStart = start + idx * stepDur;
      const t = Math.min(1, (performance.now() - segStart) / stepDur);
      if (idx >= positions.length) {
        const { x, z } = tileCenter(positions[positions.length - 1]);
        mesh.position.set(x, TOKEN_Y, z);
        if (done) done();
        return;
      }
      const prevPos = idx === 0 ? from : (() => { const c = tileCenter(positions[idx - 1]); return new THREE.Vector3(c.x, TOKEN_Y, c.z); })();
      const nextC = tileCenter(positions[idx]);
      const x = prevPos.x + (nextC.x - prevPos.x) * t;
      const z = prevPos.z + (nextC.z - prevPos.z) * t;
      const hop = Math.sin(t * Math.PI) * 0.35;
      mesh.position.set(x, TOKEN_Y + hop, z);
      requestAnimationFrame(animate);
    };
    requestAnimationFrame(animate);
  }

  // Update houses/hotels on a tile.
  setBuildings(pos, houses) {
    const group = this.houseGroups.get(pos);
    if (!group) return;
    while (group.children.length) group.remove(group.children[0]);
    const space = BOARD[pos];
    if (!space || space.type !== 'property') return;
    const { x, z, side } = tileCenter(pos);
    // place along the inner edge
    if (houses === 5) {
      // hotel
      const hotel = new THREE.Mesh(
        new THREE.BoxGeometry(0.6, 0.5, 0.4),
        new THREE.MeshStandardMaterial({ color: 0xc0392b, roughness: 0.5 })
      );
      hotel.castShadow = true;
      hotel.position.y = 0.25;
      group.add(hotel);
    } else {
      for (let i = 0; i < houses; i++) {
        const house = new THREE.Mesh(
          new THREE.BoxGeometry(0.22, 0.28, 0.28),
          new THREE.MeshStandardMaterial({ color: 0x27ae60, roughness: 0.5 })
        );
        house.castShadow = true;
        house.position.set(-0.32 + i * 0.22, 0.14, 0);
        group.add(house);
      }
    }
  }

  syncBuildings(properties) {
    for (const space of BOARD) {
      if (space.type !== 'property') continue;
      const prop = properties[space.pos];
      this.setBuildings(space.pos, prop ? prop.houses : 0);
    }
  }

  // Highlight the current player's token with a soft glow ring.
  highlightPlayer(playerId) {
    if (this.highlight) {
      this.scene.remove(this.highlight);
      this.highlight = null;
    }
    if (playerId == null) return;
    const mesh = this.tokenMeshes.get(playerId);
    if (!mesh) return;
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(0.7, 0.85, 32),
      new THREE.MeshBasicMaterial({ color: 0xffe066, side: THREE.DoubleSide, transparent: true, opacity: 0.85 })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.copy(mesh.position);
    ring.position.y = 0.04;
    this.scene.add(ring);
    this.highlight = ring;
    this._highlightTarget = mesh;
  }

  focusTile(pos) {
    const { x, z } = tileCenter(pos);
    this.controls.target.set(x, 0, z);
  }

  resetCamera() {
    this.controls.target.set(0, 0, 0);
  }

  _loop() {
    if (!this._running) return;
    requestAnimationFrame(this._loop);
    const dt = this._clock.getDelta();
    // dice spin animation
    for (const mesh of this.diceMeshes) {
      if (mesh.userData.spin) {
        const s = mesh.userData.spin;
        const t = Math.min(1, (performance.now() - s.start) / s.duration);
        // tumbling rotation, easing to target at the end
        const ease = t < 0.7 ? t / 0.7 : 1;
        mesh.rotation.x = s.target.x * ease + (1 - ease) * Math.PI * 4 * (1 - t);
        mesh.rotation.y = s.target.y * ease + (1 - ease) * Math.PI * 3 * (1 - t);
        mesh.rotation.z = s.target.z * ease + (1 - ease) * Math.PI * 5 * (1 - t);
        if (t >= 1) {
          mesh.rotation.set(s.target.x, s.target.y, s.target.z);
          delete mesh.userData.spin;
        }
      }
      // gentle bob
      const rest = mesh.userData.restPos;
      if (rest && mesh.visible) {
        mesh.position.y = rest.y + Math.sin(performance.now() / 400 + mesh.position.x) * 0.04;
      }
    }
    // keep highlight ring under its token
    if (this.highlight && this._highlightTarget) {
      this.highlight.position.x = this._highlightTarget.position.x;
      this.highlight.position.z = this._highlightTarget.position.z;
      this.highlight.rotation.z += dt * 1.5;
    }
    // advance token tweens
    for (const mesh of this.tokenMeshes.values()) {
      const tw = mesh.userData.tween;
      if (!tw) continue;
      const t = Math.min(1, (performance.now() - tw.start) / tw.dur);
      // easeInOutQuad
      const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      const x = tw.from.x + tw.dx * e;
      const z = tw.from.z + tw.dz * e;
      const hop = Math.sin(t * Math.PI) * 0.45;
      mesh.position.set(x, TOKEN_Y + hop, z);
      if (t >= 1) {
        mesh.position.set(tw.tx, TOKEN_Y, tw.tz);
        delete mesh.userData.tween;
      }
    }
    this.controls.update();
    this.renderer.render(this.scene, this.camera);
  }

  resize() {
    if (!this.container) return;
    const w = this.container.clientWidth;
    const h = this.container.clientHeight;
    this.camera.aspect = w / h;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(w, h);
  }

  dispose() {
    this._running = false;
    window.removeEventListener('resize', this._onResize);
    this.renderer.dispose();
    if (this.renderer.domElement.parentNode) {
      this.renderer.domElement.parentNode.removeChild(this.renderer.domElement);
    }
  }
}


// ===== js/morelikelame.js =====
const applyAction = dispatch;  /* alias of dispatch */
// morelikelame.js — central coordinator.
// Owns the authoritative state when mode is 'host' or 'local'; mirrors the
// host's state when mode is 'client'. Subscribers (the UI) get {state, events}
// on every change. Events drive animations and sounds.





class morelikelame {
  constructor() {
    this.state = initialState();
    this.mode = null;            // 'local' | 'host' | 'client'
    this.selfId = null;          // peer id (network) or 'local'
    this.selfPlayerId = null;    // player id within the morelikelame
    this.code = null;            // room code (host/client)
    this.subs = [];
    this.net = new Network();
    this.lobby = [];             // pending players (host)
    this.meta = { mode: null, selfId: null, roomCode: null, players: [] };
    this._installNetworkHandlers();
  }

  subscribe(cb) {
    this.subs.push(cb);
    cb({ state: this.state, events: [] });
    return () => { this.subs = this.subs.filter(f => f !== cb); };
  }

  _emit(events) {
    for (const cb of this.subs) cb({ state: this.state, events: events || [] });
  }

  _installNetworkHandlers() {
    this.net.onState = (msg) => this._onRemoteMessage(msg);
    this.net.onJoin = (connId, msg) => this._onClientJoin(connId, msg);
    this.net.onAction = (action, fromConnId) => this._onRemoteAction(action, fromConnId);
    this.net.onConnClose = (connId) => this._onClientLeave(connId);
  }

  // ---- Local (pass-and-play on one device) -------------------------------
  startLocal(players) {
    this.mode = 'local';
    this.selfId = 'local';
    this.selfPlayerId = players[0]?.id || null;
    const { state, events } = startmorelikelame(this.state, players);
    this.state = state;
    this.meta = { mode: 'local', selfId: 'local', roomCode: null, players };
    savemorelikelame(this.state, this.meta);
    this._emit(events);
  }

  // ---- Host --------------------------------------------------------------
  async startHost(code, profile) {
    this.mode = 'host';
    this.code = code || makeRoomCode();
    this.selfId = await this.net.host(this.code);
    this.selfPlayerId = this.selfId;
    this.lobby = [{
      id: this.selfId, name: profile.name, token: profile.token,
      color: profile.color, isHost: true,
    }];
    this.meta = { mode: 'host', selfId: this.selfId, roomCode: this.code, players: this.lobby };
    this._emit([{ type: 'lobby', lobby: this.lobby, code: this.code }]);
  }

  _onClientJoin(connId, msg) {
    if (this.lobby.find(p => p.id === connId)) return;
    if (this.state.phase !== 'lobby' && this.state.phase !== undefined && this.state.players.length > 0) {
      // morelikelame already in progress — reject
      this.net.sendTo(connId, { type: 'lobby', error: 'started' });
      return;
    }
    if (this.lobby.length >= MAX_PLAYERS) {
      this.net.sendTo(connId, { type: 'lobby', error: 'full' });
      return;
    }
    this.lobby.push({ id: connId, name: msg.name, token: msg.token, color: msg.color });
    this._broadcastLobby();
  }

  _onClientLeave(connId) {
    const wasInLobby = this.lobby.find(p => p.id === connId);
    this.lobby = this.lobby.filter(p => p.id !== connId);
    if (this.state.phase === 'lobby' || this.state.players.length === 0) {
      this._broadcastLobby();
      return;
    }
    // Mid-morelikelame disconnect: mark the player bankrupt so the morelikelame can continue.
    const player = this.state.players.find(p => p.id === connId);
    if (player && !player.bankrupt) {
      const action = { kind: 'force-bankrupt', playerId: connId };
      // rules.js doesn't have this action; emulate by direct state mutation:
      this.state = JSON.parse(JSON.stringify(this.state));
      const p = this.state.players.find(pl => pl.id === connId);
      if (p) {
        p.bankrupt = true;
        p.cash = 0;
        // release their properties to the bank
        for (const pos of Object.keys(this.state.properties)) {
          if (this.state.properties[pos]?.owner === connId) {
            this.state.properties[pos].owner = null;
            this.state.properties[pos].mortgaged = true;
          }
        }
        this.state.log.push({ t: Date.now(), msg: `${p.name} disconnected and went bankrupt.` });
        this.state.lastUpdate = Date.now();
      }
      savemorelikelame(this.state, this.meta);
      this._broadcastState([{ type: 'bankrupt', playerId: connId, creditorId: null }]);
      this._emit([{ type: 'bankrupt', playerId: connId, creditorId: null }]);
    }
  }

  _onRemoteAction(action, fromConnId) {
    // Host applies the action authoritatively, with a basic turn check so a
    // client can't act out of turn.
    const cur = this.state.players[this.state.currentPlayerIndex];
    if (action.kind === 'roll' || action.kind === 'end-turn') {
      if (!cur || cur.id !== fromConnId) return; // not your turn
    } else if (action.playerId && action.playerId !== fromConnId) {
      // action claims to be from a different player — reject
      return;
    }
    const { state, events } = applyAction(this.state, action);
    this.state = state;
    savemorelikelame(this.state, this.meta);
    this._broadcastState(events);
    this._emit(events);
  }

  _broadcastLobby() {
    const msg = { type: 'lobby', lobby: this.lobby, code: this.code };
    this.net.broadcast(msg);
    this._emit([{ type: 'lobby', lobby: this.lobby, code: this.code }]);
  }

  _broadcastState(events) {
    this.net.broadcast({ type: 'state', state: this.state, events: events || [] });
  }

  startHostmorelikelame() {
    const players = this.lobby.map(p => ({
      id: p.id, name: p.name, token: p.token, color: p.color,
    }));
    const { state, events } = startmorelikelame(this.state, players);
    this.state = state;
    this.meta = { mode: 'host', selfId: this.selfId, roomCode: this.code, players };
    savemorelikelame(this.state, this.meta);
    this._broadcastState(events);
    this._emit(events);
  }

  // ---- Client ------------------------------------------------------------
  async joinClient(code, profile) {
    this.mode = 'client';
    this.code = code;
    await this.net.join(code);
    this.selfId = this.net.selfId;
    this.selfPlayerId = this.selfId; // host uses our peer id as our player id
    this.net.sendJoin({
      name: profile.name, token: profile.token, color: profile.color,
    });
    this._emit([{ type: 'connecting', code }]);
  }

  _onRemoteMessage(msg) {
    if (msg.type === 'lobby') {
      if (msg.error) { this._emit([{ type: 'lobby-error', error: msg.error }]); return; }
      this.lobby = msg.lobby;
      this.code = msg.code;
      this._emit([{ type: 'lobby', lobby: msg.lobby, code: msg.code }]);
    } else if (msg.type === 'state') {
      this.selfPlayerId = this.selfId;
      this.state = msg.state;
      this._emit(msg.events || []);
    } else if (msg.type === 'welcome') {
      this.state = msg.state;
      this._emit([]);
    }
  }

  // ---- Dispatch ----------------------------------------------------------
  dispatch(action) {
    if (this.mode === 'client') {
      // Attach our player id for the host to authorize (best-effort).
      if (!action.playerId && action.kind !== 'roll' && action.kind !== 'end-turn' && action.kind !== 'start') {
        action = { ...action, playerId: this.selfPlayerId };
      } else if (!action.playerId) {
        action = { ...action, playerId: this.selfPlayerId };
      }
      this.net.sendAction(action);
      return;
    }
    // host or local
    if (!action.playerId) action = { ...action, playerId: this.selfPlayerId };
    const { state, events } = applyAction(this.state, action);
    this.state = state;
    savemorelikelame(this.state, this.meta);
    if (this.mode === 'host') this._broadcastState(events);
    this._emit(events);
  }

  close() {
    try { this.net.close(); } catch (e) {}
  }
}


// ===== js/ui.js =====
const setAudioEnabled = setEnabled;  /* alias of setEnabled */
// ui.js — all DOM screens, HUD, panels, and modals. Subscribes to morelikelame.js.





const $ = (sel) => document.querySelector(sel);
const el = (tag, props = {}, children = []) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') Object.assign(n.style, v);
    else if (v !== null && v !== undefined) n.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c == null) continue;
    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return n;
};

const TOKEN_NAMES = Object.fromEntries(TOKENS.map(t => [t.id, t.name]));

class UI {
  constructor(morelikelame, board) {
    this.morelikelame = morelikelame;
    this.board = board;
    this.audioOn = true;
    this._lastLogLen = 0;
    this._profile = { name: '', token: 'hat', color: PLAYER_COLORS[0] };
    this._localPlayers = [];
    this.morelikelame.subscribe(({ state, events }) => this._onUpdate(state, events));
  }

  mount(root) {
    this.root = root;
    root.innerHTML = `
      <div id="screen-start" class="screen"></div>
      <div id="screen-local-setup" class="screen hidden"></div>
      <div id="screen-host-lobby" class="screen hidden"></div>
      <div id="screen-join" class="screen hidden"></div>
      <div id="screen-client-lobby" class="screen hidden"></div>
      <div id="screen-morelikelame" class="screen hidden">
        <div id="board-container"></div>
        <div id="hud-top"></div>
        <div id="action-bar"></div>
        <div id="players-panel"></div>
        <div id="log-panel"></div>
        <button id="btn-menu" class="icon-btn" title="Menu">☰</button>
      </div>
      <div id="screen-morelikelameover" class="screen hidden"></div>
      <div id="modal-root"></div>
      <div id="toast"></div>
    `;
    this._renderStart();
    this._bindGlobal();
  }

  _bindGlobal() {
    $('#btn-menu')?.addEventListener('click', () => this._openMenu());
  }

  // ---- Screen routing ----------------------------------------------------
  _show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    const node = $('#' + id);
    if (node) node.classList.remove('hidden');
  }

  // ---- Start screen ------------------------------------------------------
  _renderStart() {
    const screen = $('#screen-start');
    screen.innerHTML = '';
    screen.appendChild(el('div', { class: 'title-wrap' }, [
      el('h1', { class: 'morelikelame-title', text: 'MONOPOLY' }),
      el('div', { class: 'morelikelame-title-3d', text: '3D' }),
      el('p', { class: 'subtitle', text: 'Multiplayer · Classic US Rules · 3D low-poly' }),
      el('div', { class: 'button-col' }, [
        el('button', { class: 'btn primary', onclick: () => this._goLocalSetup(), text: 'Local Pass & Play' }),
        el('button', { class: 'btn', onclick: () => this._goHost(), text: 'Host Online morelikelame' }),
        el('button', { class: 'btn', onclick: () => this._goJoin(), text: 'Join Online morelikelame' }),
        hasSave() ? el('button', { class: 'btn ghost', onclick: () => this._continueSaved(), text: 'Continue Saved morelikelame' }) : null,
      ]),
      el('p', { class: 'footer-note', html: 'All artwork (board, cards, money, 3D pieces, sounds) is procedurally generated at runtime — no copyrighted assets are bundled. Not affiliated with or endorsed by the makers of Monopoly.' }),
    ]));
    this._show('screen-start');
  }

  _goLocalSetup() {
    this._localPlayers = [];
    for (let i = 0; i < 2; i++) {
      this._localPlayers.push({
        id: 'p' + i, name: 'Player ' + (i + 1),
        token: TOKENS[i].id, color: PLAYER_COLORS[i],
      });
    }
    this._renderLocalSetup();
  }

  _renderLocalSetup() {
    const screen = $('#screen-local-setup');
    screen.innerHTML = '';
    screen.appendChild(el('div', { class: 'panel-wrap' }, [
      el('h2', { text: 'Local morelikelame Setup' }),
      el('div', { class: 'row' }, [
        el('label', { text: 'Players:' }),
        el('select', { id: 'lp-count', onchange: (e) => this._localCountChanged(+e.target.value) },
          [2,3,4,5,6].map(n => el('option', { value: n, text: n, selected: this._localPlayers.length === n ? '' : null }))),
      ]),
      el('div', { id: 'lp-list' }),
      el('div', { class: 'button-col' }, [
        el('button', { class: 'btn primary', onclick: () => this._startLocal(), text: 'Start morelikelame' }),
        el('button', { class: 'btn ghost', onclick: () => this._renderStart(), text: 'Back' }),
      ]),
    ]));
    this._renderLocalList();
    this._show('screen-local-setup');
  }

  _localCountChanged(n) {
    const cur = this._localPlayers.length;
    if (n > cur) {
      for (let i = cur; i < n; i++) {
        this._localPlayers.push({
          id: 'p' + i, name: 'Player ' + (i + 1),
          token: TOKENS[i % TOKENS.length].id, color: PLAYER_COLORS[i],
        });
      }
    } else if (n < cur) {
      this._localPlayers.length = n;
    }
    this._renderLocalList();
  }

  _renderLocalList() {
    const wrap = $('#lp-list');
    wrap.innerHTML = '';
    const usedTokens = new Set();
    this._localPlayers.forEach((p, i) => {
      const card = el('div', { class: 'player-card', style: { borderLeftColor: p.color } }, [
        el('input', { class: 'name-input', value: p.name, oninput: (e) => p.name = e.target.value, placeholder: 'Name' }),
        el('select', { onchange: (e) => { p.token = e.target.value; this._renderLocalList(); } },
          TOKENS.map(t => el('option', { value: t.id, text: t.name, selected: t.id === p.token ? '' : null }))),
        el('div', { class: 'color-swatch', style: { background: p.color } }),
      ]);
      wrap.appendChild(card);
      usedTokens.add(p.token);
    });
  }

  _startLocal() {
    resumeAudio();
    const players = this._localPlayers.map((p, i) => ({
      id: p.id, name: p.name || ('Player ' + (i + 1)), token: p.token, color: p.color,
    }));
    this.morelikelame.startLocal(players);
    this._entermorelikelame();
  }

  // ---- Host --------------------------------------------------------------
  async _goHost() {
    const name = await this._promptProfile('Host a morelikelame');
    if (!name) return;
    this._profile.name = name;
    const screen = $('#screen-host-lobby');
    screen.innerHTML = '';
    screen.appendChild(el('div', { class: 'panel-wrap' }, [
      el('h2', { text: 'Online morelikelame — Host' }),
      el('p', { text: 'Share this room code with the other players:' }),
      el('div', { id: 'host-code', class: 'room-code big', text: '…connecting…' }),
      el('p', { class: 'muted', id: 'host-status', text: '' }),
      el('h3', { text: 'Players' }),
      el('div', { id: 'host-players' }),
      el('div', { class: 'button-col' }, [
        el('button', { class: 'btn primary', id: 'host-start', onclick: () => this._startHostmorelikelame(), text: 'Start morelikelame', disabled: '' }),
        el('button', { class: 'btn ghost', onclick: () => { this.morelikelame.close(); this._renderStart(); }, text: 'Cancel' }),
      ]),
    ]));
    this._show('screen-host-lobby');
    try {
      await this.morelikelame.startHost(null, this._profile);
      $('#host-code').textContent = this.morelikelame.code;
      $('#host-status').textContent = `You are ${this._profile.name} (${TOKEN_NAMES[this._profile.token]}). Waiting for players…`;
    } catch (e) {
      $('#host-code').textContent = '—';
      $('#host-status').textContent = 'Could not create room (code in use). Please try again.';
      this._toast('Failed to create room: ' + (e && e.type ? e.type : 'error'));
    }
  }

  _startHostmorelikelame() {
    if (this.morelikelame.lobby.length < 2) { this._toast('Need at least 2 players.'); return; }
    resumeAudio();
    this.morelikelame.startHostmorelikelame();
    this._entermorelikelame();
  }

  // ---- Join --------------------------------------------------------------
  async _goJoin() {
    const screen = $('#screen-join');
    screen.innerHTML = '';
    screen.appendChild(el('div', { class: 'panel-wrap' }, [
      el('h2', { text: 'Join Online morelikelame' }),
      el('label', { text: 'Room code:' }),
      el('input', { id: 'join-code', class: 'code-input', placeholder: 'ABCD', maxlength: 4, oninput: (e) => e.target.value = e.target.value.toUpperCase() }),
      el('label', { text: 'Your name:' }),
      el('input', { id: 'join-name', placeholder: 'Your name' }),
      el('label', { text: 'Your token:' }),
      el('select', { id: 'join-token' }, TOKENS.map(t => el('option', { value: t.id, text: t.name }))),
      el('div', { class: 'button-col' }, [
        el('button', { class: 'btn primary', onclick: () => this._doJoin(), text: 'Join' }),
        el('button', { class: 'btn ghost', onclick: () => this._renderStart(), text: 'Back' }),
      ]),
      el('p', { id: 'join-status', class: 'muted' }),
    ]));
    this._show('screen-join');
  }

  async _doJoin() {
    const code = ($('#join-code').value || '').trim().toUpperCase();
    const name = ($('#join-name').value || '').trim() || 'Player';
    const token = $('#join-token').value;
    if (code.length !== 4) { this._toast('Enter a 4-letter room code.'); return; }
    this._profile = { name, token, color: PLAYER_COLORS[Math.floor(Math.random()*PLAYER_COLORS.length)] };
    $('#join-status').textContent = 'Connecting…';
    try {
      await this.morelikelame.joinClient(code, this._profile);
      this._showClientLobby();
    } catch (e) {
      $('#join-status').textContent = 'Could not join: room not found or full.';
      this._toast('Join failed: ' + (e && e.type ? e.type : 'error'));
    }
  }

  _showClientLobby() {
    const screen = $('#screen-client-lobby');
    screen.innerHTML = '';
    screen.appendChild(el('div', { class: 'panel-wrap' }, [
      el('h2', { text: 'Joined morelikelame' }),
      el('p', { text: 'Room code: ' + this.morelikelame.code }),
      el('p', { class: 'muted', text: 'Waiting for the host to start the morelikelame…' }),
      el('h3', { text: 'Players' }),
      el('div', { id: 'client-players' }),
      el('button', { class: 'btn ghost', onclick: () => { this.morelikelame.close(); this._renderStart(); }, text: 'Leave' }),
    ]));
    this._show('screen-client-lobby');
  }

  _promptProfile(title) {
    return new Promise((resolve) => {
      const overlay = el('div', { class: 'modal-overlay' });
      const card = el('div', { class: 'modal-card' }, [
        el('h2', { text: title }),
        el('label', { text: 'Your name:' }),
        el('input', { id: 'pf-name', placeholder: 'Your name', value: this._profile.name || '' }),
        el('label', { text: 'Your token:' }),
        el('select', { id: 'pf-token' }, TOKENS.map(t => el('option', { value: t.id, text: t.name, selected: t.id === this._profile.token ? '' : null }))),
        el('div', { class: 'button-col' }, [
          el('button', { class: 'btn primary', onclick: () => { const n = $('#pf-name').value.trim() || 'Player'; const t = $('#pf-token').value; this._profile = { name: n, token: t, color: PLAYER_COLORS[Math.floor(Math.random()*PLAYER_COLORS.length)] }; overlay.remove(); resolve(n); }, text: 'Continue' }),
          el('button', { class: 'btn ghost', onclick: () => { overlay.remove(); resolve(null); }, text: 'Cancel' }),
        ]),
      ]);
      overlay.appendChild(card);
      $('#modal-root').appendChild(overlay);
    });
  }

  // ---- Continue saved ----------------------------------------------------
  _continueSaved() {
    const data = loadmorelikelame();
    if (!data) { this._toast('No save found.'); return; }
    this.morelikelame.state = data.state;
    this.morelikelame.mode = data.meta.mode || 'local';
    this.morelikelame.selfId = data.meta.selfId || 'local';
    this.morelikelame.selfPlayerId = data.meta.selfId || (data.state.players[0]?.id);
    this.morelikelame.meta = data.meta;
    this.morelikelame._emit([{ type: 'restore' }]);
    this._entermorelikelame();
  }

  // ---- Enter the morelikelame screen --------------------------------------------
  _entermorelikelame() {
    this._show('screen-morelikelame');
    const container = $('#board-container');
    if (container && !container._mounted) {
      this.board.init(container);
      container._mounted = true;
    }
    this.board.resize();
    this._rendermorelikelame();
  }

  // ---- Main update from morelikelame.js -----------------------------------------
  _onUpdate(state, events) {
    // Lobby events
    const lobbyEv = events.find(e => e.type === 'lobby');
    if (lobbyEv) this._renderLobbyLists(lobbyEv.lobby, lobbyEv.code);
    const lobbyErr = events.find(e => e.type === 'lobby-error');
    if (lobbyErr) {
      const msg = lobbyErr.error === 'full' ? 'Room is full.' : lobbyErr.error === 'started' ? 'morelikelame already started.' : 'Cannot join.';
      this._toast(msg);
      this.morelikelame.close();
      this._renderStart();
      return;
    }
    // In-lobby: keep lobby screen visible
    if (state.phase === 'lobby' || state.players.length === 0) return;

    // If we just entered a morelikelame (host started), switch to morelikelame screen.
    if (!$('#screen-morelikelame').classList.contains('hidden') === false) {
      // already on morelikelame screen
    }
    if ($('#screen-morelikelame').classList.contains('hidden')) {
      this._entermorelikelame();
    }
    this._rendermorelikelame();
    this._handleEvents(events, state);
  }

  _renderLobbyLists(lobby, code) {
    const renderList = (containerId) => {
      const c = $('#' + containerId);
      if (!c) return;
      c.innerHTML = '';
      lobby.forEach(p => {
        c.appendChild(el('div', { class: 'player-card', style: { borderLeftColor: p.color } }, [
          el('span', { text: p.name }),
          el('span', { class: 'muted', text: ' · ' + TOKEN_NAMES[p.token] }),
        ]));
      });
    };
    renderList('host-players');
    renderList('client-players');
    const startBtn = $('#host-start');
    if (startBtn) {
      startBtn.disabled = lobby.length < 2 ? '' : null;
      if (startBtn.disabled) startBtn.textContent = `Start morelikelame (need 2+)`;
      else startBtn.textContent = 'Start morelikelame';
    }
    if (code && $('#host-code')) $('#host-code').textContent = code;
  }

  // ---- morelikelame screen rendering --------------------------------------------
  _rendermorelikelame() {
    const state = this.morelikelame.state;
    if (!state || state.players.length === 0) return;
    const cur = state.players[state.currentPlayerIndex];
    const isMyTurn = this._isMyTurn();

    // Sync 3D board
    this.board.setupPlayers(state.players);
    this.board.syncTokens(state.players);
    this.board.syncBuildings(state.properties);
    this.board.highlightPlayer(isMyTurn ? cur?.id : null);

    // HUD top
    const hud = $('#hud-top');
    hud.innerHTML = '';
    if (cur) {
      hud.appendChild(el('div', { class: 'turn-indicator', style: { borderColor: cur.color } }, [
        el('div', { class: 'who', html: `<span style="color:${cur.color}">●</span> <b>${cur.name}</b>'s turn` }),
        state.dice ? el('div', { class: 'dice-display', text: `🎲 ${state.dice[0]} + ${state.dice[1]} = ${state.dice[0]+state.dice[1]}` }) : el('div', { class: 'dice-display muted', text: 'Roll the dice' }),
      ]));
    }

    // Action bar
    const bar = $('#action-bar');
    bar.innerHTML = '';
    if (state.phase === 'morelikelameover') {
      bar.appendChild(el('div', { class: 'muted', text: 'morelikelame over.' }));
      this._showmorelikelameOver();
      return;
    }
    const pending = state.pending;
    const auction = state.auction;
    if (pending && pending.playerId === (cur?.id)) {
      // The pending action belongs to the current player.
      if (pending.kind === 'buy-or-auction') {
        const sp = BOARD[pending.pos];
        if (isMyTurn) {
          bar.appendChild(el('div', { class: 'action-group' }, [
            el('button', { class: 'btn primary', onclick: () => this.morelikelame.dispatch({ kind: 'buy', playerId: cur.id }), text: `Buy ${sp.name} ($${sp.price})` }),
            el('button', { class: 'btn', onclick: () => this.morelikelame.dispatch({ kind: 'decline-buy', playerId: cur.id }), text: 'Auction' }),
          ]));
        } else {
          bar.appendChild(el('div', { class: 'muted', text: `${cur.name} is deciding whether to buy ${sp.name}.` }));
        }
      } else if (pending.kind === 'income-tax') {
        const nw = netWorth(state, cur.id);
        const tenPct = Math.floor(nw * 0.10);
        if (isMyTurn) {
          bar.appendChild(el('div', { class: 'action-group' }, [
            el('button', { class: 'btn primary', onclick: () => this.morelikelame.dispatch({ kind: 'income-tax', playerId: cur.id, choice: 'flat' }), text: 'Pay $200' }),
            el('button', { class: 'btn', onclick: () => this.morelikelame.dispatch({ kind: 'income-tax', playerId: cur.id, choice: 'percent' }), text: `Pay 10% ($${tenPct})` }),
          ]));
        }
      }
    } else if (auction) {
      this._openAuctionModal();
    } else {
      // No auction active — close any stale auction modal left over.
      if (this._auctionModalOpen) { this._closeModal(); this._auctionModalOpen = false; }
      if (isMyTurn && !state.rolledThisTurn) {
        // Roll phase
        if (cur.inJail) {
          bar.appendChild(el('div', { class: 'action-group' }, [
            el('button', { class: 'btn primary', onclick: () => this.morelikelame.dispatch({ kind: 'roll' }), text: 'Roll for Doubles' }),
            el('button', { class: 'btn', onclick: () => this.morelikelame.dispatch({ kind: 'jail-fine', playerId: cur.id }), text: 'Pay $50' }),
            cur.getOutCards > 0 ? el('button', { class: 'btn', onclick: () => this.morelikelame.dispatch({ kind: 'jail-gooj', playerId: cur.id }), text: 'Use GOOJ' }) : null,
          ]));
        } else {
          const rollLabel = state.doublesCount > 0 ? '🎲 Roll Again (doubles!)' : '🎲 Roll Dice';
          bar.appendChild(el('div', { class: 'action-group' }, [
            el('button', { class: 'btn primary big', onclick: () => this.morelikelame.dispatch({ kind: 'roll' }), text: rollLabel }),
            state.doublesCount > 0 ? el('button', { class: 'btn ghost', onclick: () => this.morelikelame.dispatch({ kind: 'end-turn' }), text: 'End Turn' }) : null,
            el('button', { class: 'btn', onclick: () => this._openTradeModal(), text: 'Trade' }),
            el('button', { class: 'btn', onclick: () => this._openBuildModal(), text: 'Build / Manage' }),
          ]));
        }
      } else if (isMyTurn && state.rolledThisTurn) {
        bar.appendChild(el('div', { class: 'action-group' }, [
          el('button', { class: 'btn primary', onclick: () => this.morelikelame.dispatch({ kind: 'end-turn' }), text: 'End Turn' }),
          el('button', { class: 'btn', onclick: () => this._openTradeModal(), text: 'Trade' }),
          el('button', { class: 'btn', onclick: () => this._openBuildModal(), text: 'Build / Manage' }),
        ]));
      } else {
        bar.appendChild(el('div', { class: 'muted', text: cur ? `Waiting for ${cur.name}…` : '' }));
      }
    }

    // Players panel
    this._renderPlayersPanel(state);
    // Log panel
    this._renderLog(state);
  }

  _isMyTurn() {
    const state = this.morelikelame.state;
    if (!state || state.players.length === 0) return false;
    const cur = state.players[state.currentPlayerIndex];
    if (!cur) return false;
    if (this.morelikelame.mode === 'local') return true;
    return cur.id === this.morelikelame.selfPlayerId;
  }

  _renderPlayersPanel(state) {
    const panel = $('#players-panel');
    panel.innerHTML = '';
    panel.appendChild(el('h3', { text: 'Players' }));
    state.players.forEach(p => {
      const isCur = state.players[state.currentPlayerIndex].id === p.id;
      const propCount = Object.values(state.properties).filter(pr => pr.owner === p.id).length;
      const card = el('div', {
        class: 'pp-card' + (isCur ? ' active' : '') + (p.bankrupt ? ' bankrupt' : ''),
        style: { borderLeftColor: p.color },
        onclick: () => this._openPlayerAssets(p.id),
      }, [
        el('div', { class: 'pp-name', html: `<span class="dot" style="background:${p.color}"></span> ${p.name}${p.bankrupt ? ' (bankrupt)' : ''}` }),
        el('div', { class: 'pp-cash', text: '$' + p.cash }),
        el('div', { class: 'pp-meta', text: `${propCount} properties${p.getOutCards ? ' · ' + p.getOutCards + ' GOOJ' : ''}${p.inJail ? ' · in jail' : ''}` }),
      ]);
      panel.appendChild(card);
    });
  }

  _renderLog(state) {
    const panel = $('#log-panel');
    const show = state.log.slice(-8).reverse();
    panel.innerHTML = '';
    panel.appendChild(el('h3', { text: 'Log' }));
    const list = el('div', { class: 'log-list' });
    for (const e of show) list.appendChild(el('div', { class: 'log-entry', text: e.msg }));
    panel.appendChild(list);
  }

  // ---- Events -> sounds / animations ------------------------------------
  _handleEvents(events, state) {
    if (!events) return;
    for (const e of events) {
      switch (e.type) {
        case 'dice':       sfx.dice(); this.board.showDice(e.d1, e.d2); break;
        case 'move':       sfx.move(); break;
        case 'pass-go':    sfx.passgo(); break;
        case 'buy':        sfx.buy(); this._flash(`Bought ${BOARD[e.pos].name}`); break;
        case 'pay':        if (e.reason === 'rent' || e.reason === 'card-rent') sfx.rent(); break;
        case 'collect':    sfx.buy(); break;
        case 'card':       sfx.card(); this._showCardModal(e); break;
        case 'gotojail':   sfx.jail(); break;
        case 'house':      sfx.house(); break;
        case 'sell-house': sfx.house(); break;
        case 'mortgage':   sfx.click(); break;
        case 'unmortgage': sfx.click(); break;
        case 'trade':      sfx.trade(); this._flash('Trade completed'); break;
        case 'bankrupt':   sfx.bankrupt(); this._flash('Bankrupt!'); break;
        case 'win':        sfx.win(); break;
        case 'turn':       sfx.click(); break;
        case 'auction-start': this._openAuctionModal(); break;
        case 'error':      sfx.error(); this._toast(e.msg); break;
      }
    }
  }

  _flash(msg) {
    this._toast(msg, 1400);
  }

  _toast(msg, dur = 2200) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => t.classList.remove('show'), dur);
  }

  // ---- Modals ------------------------------------------------------------
  _showCardModal(e) {
    const card = e.cardId.startsWith('ch')
      ? { deck: 'Chance', text: this._cardText('ch', e.cardId) }
      : { deck: 'Community Chest', text: this._cardText('cc', e.cardId) };
    this._modal({
      title: card.deck,
      body: el('div', { class: 'card-display ' + (e.deck === 'chance' ? 'chance' : 'chest') }, [ el('p', { text: card.text }) ]),
      buttons: [{ label: 'OK', primary: true, onclick: (close) => close() }],
    });
  }

  _cardText(prefix, id) {
    const arr = prefix === 'ch' ? CHANCE_CARDS : CHEST_CARDS;
    return (arr.find(c => c.id === id) || {}).text || '';
  }

  _openAuctionModal() {
    const state = this.morelikelame.state;
    const a = state.auction;
    if (!a) return;
    this._auctionModalOpen = true;
    const sp = BOARD[a.pos];
    const currentBidderId = a.bidders[a.currentIndex];
    const isMine = currentBidderId === this.morelikelame.selfPlayerId || this.morelikelame.mode === 'local';
    const bidder = state.players.find(p => p.id === currentBidderId);
    this._modal({
      title: `Auction: ${sp.name}`,
      body: el('div', { class: 'auction-body' }, [
        el('p', { html: `Price if bought normally: <b>$${sp.price}</b>` }),
        el('p', { html: `High bid: <b>$${a.highBid}</b>${a.highBidder ? ' by ' + state.players.find(p=>p.id===a.highBidder)?.name : ''}` }),
        el('p', { text: `Current bidder: ${bidder?.name}` }),
        isMine ? el('input', { id: 'auc-bid', class: 'num-input', type: 'number', min: a.highBid + 1, value: a.highBid + 1 }) : el('p', { class: 'muted', text: 'Waiting for ' + bidder?.name + '…' }),
      ]),
      buttons: isMine ? [
        { label: 'Place Bid', primary: true, onclick: (close) => {
          const v = parseInt($('#auc-bid').value, 10);
          if (!v || v <= a.highBid) { this._toast('Bid too low.'); return; }
          this.morelikelame.dispatch({ kind: 'bid', playerId: currentBidderId, amount: v });
          close();
        }},
        { label: 'Pass', onclick: (close) => { this.morelikelame.dispatch({ kind: 'pass-bid', playerId: currentBidderId }); close(); } },
      ] : [],
    });
  }

  _openBuildModal() {
    const state = this.morelikelame.state;
    const me = this._me();
    if (!me) return;
    const myProps = BOARD.filter(s => s.type === 'property' && state.properties[s.pos]?.owner === me.id);
    this._modal({
      title: 'Build / Manage Properties',
      body: el('div', { class: 'deed-list' }, myProps.length === 0 ? [el('p', { class: 'muted', text: 'You own no properties.' })] :
        myProps.map(s => {
          const prop = state.properties[s.pos];
          const owns = this._ownsGroup(state, me.id, s.group);
          return el('div', { class: 'deed-row', style: { borderLeftColor: GROUP_COLORS[s.group] } }, [
            el('div', { class: 'deed-info' }, [
              el('div', { class: 'deed-name', text: s.name }),
              el('div', { class: 'deed-meta', text: prop.houses === 5 ? 'Hotel' : (prop.houses > 0 ? prop.houses + ' house(s)' : 'No buildings') + (prop.mortgaged ? ' · mortgaged' : '') }),
            ]),
            el('div', { class: 'deed-actions' }, [
              prop.mortgaged
                ? el('button', { class: 'btn small', onclick: () => { this.morelikelame.dispatch({ kind: 'unmortgage', playerId: me.id, pos: s.pos }); this._closeModal(); this._openBuildModal(); }, text: 'Unmortgage' })
                : (owns && prop.houses < 5
                    ? el('button', { class: 'btn small', onclick: () => { this.morelikelame.dispatch({ kind: 'buy-house', playerId: me.id, pos: s.pos }); this._closeModal(); this._openBuildModal(); }, text: `+ House ($${s.house})` })
                    : null),
              prop.houses > 0
                ? el('button', { class: 'btn small', onclick: () => { this.morelikelame.dispatch({ kind: 'sell-house', playerId: me.id, pos: s.pos }); this._closeModal(); this._openBuildModal(); }, text: `Sell ($${Math.floor(s.house/2)})` })
                : null,
              !prop.mortgaged && prop.houses === 0
                ? el('button', { class: 'btn small ghost', onclick: () => { this.morelikelame.dispatch({ kind: 'mortgage', playerId: me.id, pos: s.pos }); this._closeModal(); this._openBuildModal(); }, text: `Mortgage ($${Math.floor(s.price/2)})` })
                : null,
            ]),
          ]);
        })
      ),
      buttons: [{ label: 'Close', primary: true, onclick: (close) => close() }],
    });
  }

  _openTradeModal() {
    const state = this.morelikelame.state;
    const me = this._me();
    if (!me) return;
    const others = state.players.filter(p => !p.bankrupt && p.id !== me.id);
    if (others.length === 0) { this._toast('No other players to trade with.'); return; }
    let partnerId = others[0].id;
    const myProps = BOARD.filter(s => state.properties[s.pos]?.owner === me.id);
    const update = () => {
      const partner = state.players.find(p => p.id === partnerId);
      const theirProps = BOARD.filter(s => state.properties[s.pos]?.owner === partnerId);
      body.innerHTML = '';
      body.appendChild(el('div', { class: 'trade-row' }, [
        el('label', { text: 'Trade with:' }),
        el('select', { onchange: (e) => { partnerId = e.target.value; update(); } },
          others.map(p => el('option', { value: p.id, text: p.name, selected: p.id === partnerId ? '' : null }))),
      ]));
      const left = el('div', { class: 'trade-col' }, [
        el('h4', { text: `You give (${me.name})` }),
        el('label', { text: 'Cash:' }),
        el('input', { id: 'tr-from-cash', class: 'num-input', type: 'number', min: 0, value: 0, max: me.cash }),
        el('div', { class: 'prop-checks' }, myProps.map(s =>
          el('label', { class: 'prop-check' }, [
            el('input', { type: 'checkbox', 'data-from-pos': s.pos }),
            el('span', { text: s.name, style: { borderLeftColor: GROUP_COLORS[s.group] } }),
          ])
        )),
        me.getOutCards > 0 ? el('label', { class: 'prop-check' }, [ el('input', { type: 'checkbox', id: 'tr-from-gooj' }), el('span', { text: 'Get Out of Jail Free card' }) ]) : null,
      ]);
      const right = el('div', { class: 'trade-col' }, [
        el('h4', { text: `${partner.name} gives` }),
        el('label', { text: 'Cash:' }),
        el('input', { id: 'tr-to-cash', class: 'num-input', type: 'number', min: 0, value: 0, max: partner.cash }),
        el('div', { class: 'prop-checks' }, theirProps.map(s =>
          el('label', { class: 'prop-check' }, [
            el('input', { type: 'checkbox', 'data-to-pos': s.pos }),
            el('span', { text: s.name, style: { borderLeftColor: GROUP_COLORS[s.group] } }),
          ])
        )),
        partner.getOutCards > 0 ? el('label', { class: 'prop-check' }, [ el('input', { type: 'checkbox', id: 'tr-to-gooj' }), el('span', { text: 'Get Out of Jail Free card' }) ]) : null,
      ]);
      body.appendChild(el('div', { class: 'trade-cols' }, [left, right]));
    };
    let body = el('div', { class: 'trade-body' });
    update();
    this._modal({
      title: 'Propose a Trade',
      body,
      buttons: [
        { label: 'Confirm Trade', primary: true, onclick: (close) => {
          const fromCash = parseInt($('#tr-from-cash').value, 10) || 0;
          const toCash = parseInt($('#tr-to-cash').value, 10) || 0;
          const fromProps = [...document.querySelectorAll('[data-from-pos]')].filter(c => c.checked).map(c => +c.getAttribute('data-from-pos'));
          const toProps   = [...document.querySelectorAll('[data-to-pos]')].filter(c => c.checked).map(c => +c.getAttribute('data-to-pos'));
          const fromGooj = $('#tr-from-gooj')?.checked ? 1 : 0;
          const toGooj = $('#tr-to-gooj')?.checked ? 1 : 0;
          if (!fromCash && !toCash && !fromProps.length && !toProps.length && !fromGooj && !toGooj) { this._toast('Nothing to trade.'); return; }
          this.morelikelame.dispatch({ kind: 'trade', offer: {
            from: me.id, to: partnerId,
            fromGives: { cash: fromCash, properties: fromProps, goojCards: fromGooj },
            toGives:   { cash: toCash,   properties: toProps,   goojCards: toGooj },
          }});
          close();
        }},
        { label: 'Cancel', onclick: (close) => close() },
      ],
    });
  }

  _openPlayerAssets(playerId) {
    const state = this.morelikelame.state;
    const p = state.players.find(pl => pl.id === playerId);
    if (!p) return;
    const props = BOARD.filter(s => state.properties[s.pos]?.owner === playerId);
    this._modal({
      title: `${p.name}'s Assets`,
      body: el('div', { class: 'deed-list' }, [
        el('p', { html: `Cash: <b>$${p.cash}</b>${p.inJail ? ' · in jail' : ''}${p.getOutCards ? ' · ' + p.getOutCards + ' GOOJ card(s)' : ''}` }),
        props.length === 0 ? el('p', { class: 'muted', text: 'No properties.' }) :
          props.map(s => {
            const prop = state.properties[s.pos];
            return el('div', { class: 'deed-row', style: { borderLeftColor: GROUP_COLORS[s.group] } }, [
              el('div', { class: 'deed-info' }, [
                el('div', { class: 'deed-name', text: s.name }),
                el('div', { class: 'deed-meta', text: `$${s.price}${prop.houses === 5 ? ' · Hotel' : prop.houses > 0 ? ' · ' + prop.houses + ' house(s)' : ''}${prop.mortgaged ? ' · mortgaged' : ''}` }),
              ]),
            ]);
          }),
      ]),
      buttons: [{ label: 'Close', primary: true, onclick: (close) => close() }],
    });
  }

  _openMenu() {
    this._modal({
      title: 'Menu',
      body: el('div', { class: 'button-col' }, [
        el('button', { class: 'btn', onclick: (close) => { this.audioOn = !this.audioOn; setAudioEnabled(this.audioOn); close(); this._openMenu(); }, text: (this.audioOn ? 'Mute' : 'Unmute') + ' Sound' }),
        el('button', { class: 'btn', onclick: (close) => { this.board.resetCamera(); close(); }, text: 'Reset Camera' }),
        el('button', { class: 'btn ghost', onclick: (close) => { if (confirm('Leave the morelikelame?')) { this.morelikelame.close(); clearSave(); close(); this._renderStart(); } }, text: 'Leave morelikelame' }),
      ]),
      buttons: [{ label: 'Close', primary: true, onclick: (close) => close() }],
    });
  }

  _showmorelikelameOver() {
    const state = this.morelikelame.state;
    const winner = state.players.find(p => p.id === state.winner);
    const screen = $('#screen-morelikelameover');
    screen.innerHTML = '';
    screen.appendChild(el('div', { class: 'panel-wrap' }, [
      el('h1', { class: 'win-title', text: 'morelikelame Over' }),
      el('p', { class: 'win-name', style: { color: winner?.color }, text: `${winner?.name} wins!` }),
      el('button', { class: 'btn primary', onclick: () => { clearSave(); this.morelikelame.close(); this._renderStart(); }, text: 'New morelikelame' }),
    ]));
    this._show('screen-morelikelameover');
  }

  // ---- Helpers -----------------------------------------------------------
  _me() {
    const state = this.morelikelame.state;
    if (this.morelikelame.mode === 'local') return state.players[state.currentPlayerIndex];
    return state.players.find(p => p.id === this.morelikelame.selfPlayerId);
  }

  _ownsGroup(state, playerId, group) {
    const members = BOARD.filter(s => s.group === group);
    return members.every(s => state.properties[s.pos]?.owner === playerId);
  }

  _modal({ title, body, buttons }) {
    this._closeModal();
    const overlay = el('div', { class: 'modal-overlay' });
    const card = el('div', { class: 'modal-card' }, [
      el('h2', { text: title }),
      body,
      el('div', { class: 'modal-buttons' },
        buttons.map(b => el('button', { class: 'btn ' + (b.primary ? 'primary' : ''), onclick: () => b.onclick(() => overlay.remove()), text: b.label }))
      ),
    ]);
    overlay.appendChild(card);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    $('#modal-root').appendChild(overlay);
    this._currentModal = overlay;
  }

  _closeModal() {
    if (this._currentModal) { this._currentModal.remove(); this._currentModal = null; }
  }
}

// main.js — bootstrap. Wires morelikelame + Board3D + UI together.




function boot() {
  const game = new morelikelame();
  const board = new Board3D();
  const ui = new UI(game, board);
  ui.mount(document.getElementById('app'));
  // Expose for debugging in the browser console.
  window.__monopoly3d = { morelikelame: game, board, ui };
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

  </script>
